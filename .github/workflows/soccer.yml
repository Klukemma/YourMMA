name: Soccer predictions

# The soccer app's runner: soccer/engine on GitHub's machines, which have
# the open internet (football-data.co.uk) that the development sandbox
# does not.
#
#   predict   sync this season's results and the fixtures still to play
#             from football-data.co.uk, and the free fixture feeds (ESPN's
#             scoreboard, fixturedownload.com) into soccer/data/feed.json;
#             run the model over every match since 2005-06, log the picks
#             before they freeze, grade the finished ones (provisionally on
#             the feeds' scores until football-data.co.uk posts its own),
#             rebuild soccer/app/data and the standalone page, commit. A feed
#             that fails keeps what is on file and never fails the run.
#   sync      football-data.co.uk snapshot only (every season with full=true)
#   probe     save what the free fixture feeds return (probe_feeds.py) as
#             test fixtures - the sandbox cannot reach them
#
# On a schedule it runs predict every month: the app carries every league
# with a current season (soccer_leagues.in_app()), and the calendar-year
# leagues (ARG BRA CHN FIN IRL NOR SWE USA) play through June and July, when
# Europe's are between seasons - a run that skipped those months would leave
# their picks silently missing. football-data.co.uk posts the fixtures with
# prices on Friday afternoon (the weekend's) and Tuesday afternoon (the
# midweek's), and its results days after each round; the free feeds have
# the next rounds all week and each score the evening it is played. So:
# twice on Friday and Tuesday afternoons for the priced picks (the early slot
# was set for a 16:30 UTC Friday kickoff in Serie A, which GitHub's delays
# below have made it miss so far; the later one catches prices posted after
# it), Saturday and Sunday mornings to refresh before the day's games,
# Saturday and Sunday evenings for the day's results (provisional) and the
# next round, Monday, Wednesday and Thursday mornings for the round just
# played and the next one (model-alone picks until its prices land), and
# every morning over the Christmas and New Year fixtures. Two more every
# day, for the leagues that do not kick off on Europe's clock (times UTC):
# 11:37 for the Americas' evenings - MLS, Liga MX, Brazil and Argentina kick
# off about 22:00-04:00 UTC on most days of the week - and 17:37 for Asia's
# mornings - the J1 League and the Chinese Super League kick off about
# 04:00-12:00 UTC the next day.
#
# WHEN A PICK CLOSES - the deadline a slot is for (soccer_schedule, CLOSE;
# soccer_log: a closed pick is never replaced). At kickoff where the time is
# confirmed: football-data.co.uk's own fixture, or both feeds agreeing - the
# 12 leagues with both feeds (MLS the only one in the Americas) and the 7
# with none, which only football-data.co.uk lists. At 00:00 UK time on
# match day where it is not: the 18 leagues only ESPN covers (Argentina,
# Brazil, Liga MX, J1 and the Chinese Super League among them) are listed
# ten days ahead with no confirmed time and picked by the model alone, and
# that pick closes at midnight - so their priced pick needs a run between
# football-data.co.uk's Tuesday/Friday posting and 00:00 UK on match day,
# not merely one before kickoff.
#
# GITHUB'S DELAYS, measured (gh run list, the 26 scheduled runs of Oct 26 -
# Nov 11, each against its slot): every run started late, 3.0 to 10.6 hours
# - the 07:17 slots 6.3-8.1 h, 09:17 6.9-10.6 h (Mon Nov 9's started at
# 19:50), 13:47 5.1-6.8 h, 16:47 4.2-5.3 h, 22:17 3.0-3.4 h - and a run then
# takes a few minutes before it logs. The two daily slots have not run yet;
# at the delays of the slots either side of them they add margin, not a
# guarantee: 11:37 would start between 16:43 and 22:13 (before a 22:00 UTC
# kickoff unless it is as late as the worst Monday-morning slot), 17:37
# between 20:37 and 22:55 (before 00:00 UK in winter; in summer, when that
# midnight is 23:00 UTC, only just, if at all). No slot can guarantee a deadline under
# the worst delay seen: 11:37 started 10.6 h late is 22:13, after a 22:00
# UTC kickoff, and 17:37 is 04:13 the next day, past that midnight. A match
# whose pick closes before any run has logged one gets no pick - it is
# never picked afterwards - and one closed with the model-alone pick keeps
# it. A predict run over every league takes a few minutes (soccer/README.md,
# The runner).
#
# A run where nothing but the stamps changed (when it ran: "generated", each
# feed request's answer time, an open pick's last re-log) commits nothing:
# soccer/engine/only_stamps.py puts such files back before the commit step
# looks, and the standalone page with them unless its data changed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "predict = this week's picks; sync = data only; probe = save the fixture feeds as test fixtures"
        type: choice
        options: [predict, sync, probe, probe-leagues]
        default: predict
      full:
        description: "sync only: rebuild every season since 2005-06, not just this one"
        type: boolean
        default: false
  schedule:
    - cron: "47 13 * * FRI"   # the weekend's fixtures and prices
    - cron: "47 16 * * FRI"   # ...and prices posted later in the afternoon
    - cron: "17 7 * * SAT"    # before Saturday's early games
    - cron: "17 7 * * SUN"    # before Sunday's; grade Saturday
    - cron: "17 22 * * SAT"   # Saturday's results the evening they happen (after a 21:00 CET full time); the next round
    - cron: "17 22 * * SUN"   # Sunday's results; the next round
    - cron: "17 9 * * MON"    # grade the weekend
    - cron: "47 13 * * TUE"   # the midweek fixtures and prices
    - cron: "47 16 * * TUE"   # ...and prices posted later in the afternoon
    - cron: "17 7 * * WED"    # Tuesday's results; the weekend's round early
    - cron: "17 9 * * THU"    # grade the midweek round
    - cron: "37 11 * * *"     # the Americas' evenings (22:00-04:00 UTC kickoffs): margin, not a guarantee - see above
    - cron: "37 17 * * *"     # Asia's mornings (04:00-12:00 UTC next day) and 00:00 UK closes: margin, not a guarantee
    - cron: "17 8 20-31 12 *" # the Christmas fixtures
    - cron: "17 8 1-3 1 *"    # ...and New Year's

permissions:
  contents: write

# Its own queue, like the NFL runner's: the soccer engine touches only
# soccer/, and the rebase-and-retry push below absorbs another runner's
# commit landing first.
concurrency:
  group: soccer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soccer:
    runs-on: ubuntu-latest
    steps:
      # The branch, not the dispatch-time commit: a run queued behind another
      # must build on what that run pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r engine/requirements.txt pytest

      # BEFORE the run, on the snapshot as committed: they check the code,
      # not football-data.co.uk's publishing clock.
      - name: Tests
        run: python -m pytest soccer/engine/tests -q -m "not snapshot"

      - name: Run
        run: |
          set -o pipefail
          MODE="${{ inputs.mode || 'predict' }}"
          if [ "$MODE" = "sync" ]; then
            python soccer/engine/soccer_data.py ${{ inputs.full && '--full' || '' }} 2>&1 | tee soccer.log
          elif [ "$MODE" = "probe" ]; then
            python soccer/engine/probe_feeds.py 2>&1 | tee soccer.log
          elif [ "$MODE" = "probe-leagues" ]; then
            # Every league the app could add, in each of its sources, saved
            # under tests/fixtures/feeds/leagues/ (probe_leagues.py).
            python soccer/engine/probe_leagues.py 2>&1 | tee soccer.log
          else
            python soccer/engine/soccer_predict.py 2>&1 | tee soccer.log
          fi

      # The snapshot's health (every top-league club has a display name, and
      # so on) depends on what the site has published: reported, never a gate.
      - name: Snapshot checks
        if: always()
        continue-on-error: true
        run: python -m pytest soccer/engine/tests -q -m snapshot

      # soccer/data/ holds the football-data.co.uk snapshot, the feeds'
      # snapshot (feed.json) and the prediction log.
      - name: Commit
        run: |
          PATHS="soccer/data/ soccer/app/data/ soccer/app/yoursoccer.html soccer/engine/tests/fixtures/feeds/"
          # Files whose only change is when the run happened go back as
          # committed (only_stamps.py says why that is honest), so a run
          # where nothing moved commits nothing.
          python soccer/engine/only_stamps.py $PATHS
          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in $PATHS; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if [ -f soccer/app/data/matches.json ]; then
            PICKS=$(python -c "import json;d=json.load(open('soccer/app/data/matches.json'));print(sum(1 for m in d['matches'] if m.get('pick') and m.get('status')=='upcoming'))")
            git commit -m "Soccer: ${PICKS} picks"
          else
            git commit -m "Soccer: refresh data"
          fi
          # Rebase and retry: a push overtaken by another run must not throw
          # away the picks.
          pushed=0
          for attempt in 1 2 3; do
            git push && { pushed=1; break; }
            echo "push rejected, rebasing onto the branch (attempt $attempt)"
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || exit 1
            sleep $((attempt * 3))
          done
          if [ "$pushed" != 1 ]; then
            git push || { echo "::error::push failed after 3 rebases"; exit 1; }
          fi
