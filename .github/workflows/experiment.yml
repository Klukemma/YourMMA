name: Run experiment

# Model experiments need ~10 minutes of uninterrupted CPU. The dev container
# suspends between turns, so long runs there never finish; a runner does.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Experiment to run (engine/experiments/*.py)"
        type: choice
        options:
          - feature_audit
          - feature_pruning
          - meta_model
          - recalibration
          - calibration_selection
          - calibrator_mismatch
          - adjustment_ablation
        default: feature_pruning

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r engine/requirements.txt

      - name: Run ${{ inputs.script }}
        run: |
          set -o pipefail
          python engine/experiments/${{ inputs.script }}.py 2>&1 | tee experiment.log

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ inputs.script }}
          path: |
            experiment.log
            engine/experiments/*.csv
          if-no-files-found: warn
