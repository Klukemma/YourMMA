const $ = (id) => document.getElementById(id);
const pct = (x, d = 0) => (x == null ? "—" : `${(x * 100).toFixed(d)}%`);
// Rounded before the sign is taken: -0.004 is "0.00", not "−0.00".
const signed = (x, d = 1) => {
  if (x == null) return "—";
  const r = Number(Number(x).toFixed(d));
  return r === 0 ? (0).toFixed(d) : `${r > 0 ? "+" : "−"}${Math.abs(r).toFixed(d)}`;
};
const num = (x, d = 2) => (x == null ? "—" : Number(x).toFixed(d));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// American odds as a bookmaker prints them.
const odds = (o) => (o == null ? "—" : o > 0 ? `+${Math.round(o)}` : o < 0 ? `−${Math.abs(Math.round(o))}` : "0");
// A spread from one side's point of view: "KC −7.5", "BUF +3", "PK".
const line = (team, pts) =>
  pts == null ? "—" : pts === 0 ? `${team} PK` : `${team} ${pts > 0 ? "+" : "−"}${Math.abs(pts)}`;
const icon = DESK.icon;
const shortDate = (d) => {
  const t = new Date(`${d}T12:00:00Z`);
  return Number.isNaN(t.getTime()) ? (d || "") : t.toLocaleDateString(undefined, { day: "numeric", month: "short", timeZone: "UTC" });
};

// Each club's colours, for the badge behind its code: [background, text].
const TEAM_COLOURS = {
  ARI: ["#97233F", "#fff"], ATL: ["#A71930", "#fff"], BAL: ["#241773", "#fff"], BUF: ["#00338D", "#fff"],
  CAR: ["#0085CA", "#000"], CHI: ["#0B162A", "#F26522"], CIN: ["#FB4F14", "#000"], CLE: ["#311D00", "#FF3C00"],
  DAL: ["#003594", "#fff"], DEN: ["#FB4F14", "#002244"], DET: ["#0076B6", "#fff"], GB: ["#203731", "#FFB612"],
  HOU: ["#03202F", "#fff"], IND: ["#002C5F", "#fff"], JAX: ["#006778", "#fff"], KC: ["#E31837", "#fff"],
  LA: ["#003594", "#FFD100"], LAC: ["#0072B0", "#fff"], LV: ["#000000", "#A5ACAF"], MIA: ["#007780", "#fff"],
  MIN: ["#4F2683", "#FFC62F"], NE: ["#002244", "#fff"], NO: ["#D3BC8D", "#101820"], NYG: ["#0B2265", "#fff"],
  NYJ: ["#125740", "#fff"], PHI: ["#004C54", "#fff"], PIT: ["#FFB612", "#101820"], SEA: ["#002244", "#69BE28"],
  SF: ["#AA0000", "#fff"], TB: ["#D50A0A", "#fff"], TEN: ["#0C2340", "#4B92DB"], WAS: ["#5A1414", "#FFB612"],
};
const teamChip = (code) => {
  const [bg, fg] = TEAM_COLOURS[code] || ["var(--ink-3)", "#fff"];
  return `<span class="teamchip" style="background:${bg};color:${fg}">${esc(code)}</span>`;
};

async function load(name) {
  const embedded = window.__YOURNFL_DATA__;
  if (embedded && embedded[name]) return embedded[name];
  const res = await fetch(`data/${name}.json`, { cache: "no-cache" });
  if (!res.ok) throw new Error(`${name}.json — ${res.status}`);
  return res.json();
}

// A caveat folded to its first two lines, the rest one tap away.
const fold = (text, extra = "") => !text ? "" : `<details class="fold">
    <summary><span class="ic">${icon("info")}</span><span class="clip">${esc(text)}</span><span class="more">More</span></summary>
    ${extra ? `<div class="fold-body">${extra}</div>` : ""}</details>`;

// A failed load says so in words and offers to try again; the developer's
// hint is one tap away.
function fail(el, error, what, retry) {
  el.innerHTML = `<div class="note err"><b>Could not load ${esc(what)}.</b> Check the connection and try again.${
    retry ? `<div style="margin-top:10px"><button class="btn small ghost" type="button" data-retry>${icon("refresh")} Try again</button></div>` : ""}</div>
    ${fold(`${error.message}. The runner writes these files; to build them locally, run python nfl/engine/nfl_predict.py.`)}`;
  const b = el.querySelector("[data-retry]");
  if (b) b.addEventListener("click", () => retry());
}

// ---------------------------------------------------------------- form

// A team's record and last five games beside its name, newest on the left:
// a filled teal circle a win, an orange ring a loss, grey a tie, and the number inside is the
// margin. This season's regular-season record; the last five reach back into
// last season when this one is young. Not a model input.
const RESULT_WORD = { W: "Win", L: "Loss", T: "Tie" };
const RESULT_CLASS = { W: "w", L: "l", T: "t" };
const FORM_LEGEND = `Under each team: this season's record, then its last five games,
  newest first - a filled teal circle a win, an orange ring a loss, grey a tie. The number is the
  margin: a teal 7 is a seven-point win. Open a game for opponents and scores.`;
// What a screen reader hears instead of the dots: "won by 7, lost by 3".
const saidFive = (last5) => (last5 || []).length
  ? `<span class="sr">, last ${last5.length}: ${esc(last5.map((b) => b.result === "T" ? "tied" : `${b.result === "W" ? "won" : "lost"} by ${b.code}`).join(", "))}</span>` : "";

const GAME_WORD = { WC: "Wild Card", DIV: "Divisional", CON: "Conference final", SB: "Super Bowl" };
function weekName(b) {
  return b.game_type && b.game_type !== "REG" ? (GAME_WORD[b.game_type] || b.game_type) : `Week ${b.week}`;
}
function gameTip(b) {
  const where = b.neutral ? "vs" : b.home ? "vs" : "at";
  return `${RESULT_WORD[b.result] || b.result} ${b.score} ${where} ${b.opponent} · ${weekName(b)} ${b.season} · ${b.date}`;
}

function formLine(form) {
  // An absent key means the data predates records; null means no games yet.
  if (form === undefined) return "";
  if (!form || !form.record) return `<span class="rec none">no games yet</span>`;
  const r = form.record;
  const text = `${r.wins}-${r.losses}${r.ties ? `-${r.ties}` : ""}`;
  const dots = (form.last5 || []).map((b) => {
    const cls = RESULT_CLASS[b.result] || "t";
    return `<span class="res ${cls}" title="${esc(gameTip(b))}" aria-hidden="true">${esc(b.code)}</span>`;
  }).join("");
  return `<span class="rec num">${esc(text)}</span><span class="last5">${dots}</span>${saidFive(form.last5)}`;
}

function formDetail(code, form) {
  if (!form || !form.last5 || !form.last5.length) return "";
  const items = form.last5.map((b) => {
    const cls = RESULT_CLASS[b.result] || "t";
    const where = b.home || b.neutral ? "vs" : "at";
    return `<li><span class="res ${cls}" aria-hidden="true">${esc(b.code)}</span>
      <span><b>${esc(RESULT_WORD[b.result] || b.result)} ${esc(b.score)}</b> ${where} ${esc(b.opponent)}
      <span class="mini"><br>${esc(weekName(b))} ${esc(b.season)} · ${esc(b.date)}</span></span></li>`;
  }).join("");
  const po = form.playoffs ? ` · playoffs ${form.playoffs.wins}-${form.playoffs.losses}` : "";
  return `<div class="panel"><div class="eyebrow">${esc(code)} · last 5${esc(po)}</div><ul class="list">${items}</ul></div>`;
}

// ---------------------------------------------------------------- week

const TIER_TONE = { STRONG: "good", SOLID: "good", LEAN: "flat", "TOSS-UP": "flat" };
const STATUS_WORD = { final: "Final", started: "Kicked off", upcoming: "" };
// Where a game stands by the phone's own clock. The data says "upcoming"
// until the next run, hours after kickoff on a busy Sunday; past its kickoff
// a game is no longer upcoming, whatever the file says. Nothing here reads a
// result - "final" still comes only from the data.
const phase = (g, now = Date.now()) => g.status === "final" ? "final"
  : Date.parse(g.kickoff) <= now ? "started" : "upcoming";
const localStamp = (iso) => {
  const t = new Date(iso);
  return Number.isNaN(t.getTime()) ? String(iso || "") : t.toLocaleString(undefined,
    { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
};

// Kickoff is stored in UTC; the phone shows its own time zone.
const kickTime = (iso) => new Date(iso).toLocaleString(undefined,
  { weekday: "short", hour: "numeric", minute: "2-digit" });
const dayKey = (iso) => new Date(iso).toLocaleDateString(undefined,
  { weekday: "long", month: "short", day: "numeric" });

// One team: club badge, nickname over record and last five, and on the right
// its chance - or its score once the game is under way.
function teamRow(g, side) {
  const code = g[side];
  const full = g[`${side}_name`] || "";
  const name = full.split(" ").slice(-1)[0];
  const p = g.home_prob == null ? null : side === "home" ? g.home_prob : 1 - g.home_prob;
  const picked = g.pick && g.pick === code;
  const scored = g.score && g.score[side] != null;
  const lost = g.status === "final" && g.score && g.score[side] < g.score[side === "home" ? "away" : "home"];
  const right = scored
    ? `<span class="score num">${esc(g.score[side])}</span>`
    : `<span class="p">${p == null ? "—" : `${DESK.share(p, 1 - p)}<small>%</small>`}</span>`;
  const lead = side === "home" && !g.neutral ? `<span class="at">home</span>` : "";
  return `<div class="side ${side === "home" ? "r" : "b"}${picked ? " picked" : ""}${lost ? " lost" : ""}">
      <span class="mark"></span>
      <div class="who">${teamChip(code)}<span class="nm" title="${esc(full)}">${esc(name)}</span>${lead}</div>
      ${right}
      <div class="sub">${formLine(g[`${side}_form`])}</div>
    </div>`;
}

function marginText(g, m) {
  if (m == null) return "—";
  if (Math.abs(m) < 0.05) return "even";
  return m > 0 ? `${esc(g.home)} wins by ${Math.abs(m).toFixed(1)}` : `${esc(g.away)} wins by ${Math.abs(m).toFixed(1)}`;
}

function resultTag(g) {
  if (g.status !== "final" || !g.pick || !g.score) return "";
  const margin = g.score.home - g.score.away;
  if (margin === 0) return `<span class="tag flat">Tie</span>`;
  const won = (margin > 0 ? g.home : g.away) === g.pick;
  return won ? `<span class="tag good">${icon("check", 'style="width:13px;height:13px"')} Right</span>` : `<span class="tag bad">Wrong</span>`;
}

function qbText(qb) {
  if (!qb) return "—";
  const src = qb.replaced ? ` (starts for ${qb.replaced}, ruled out)`
    : qb.source === "last starter" ? " (assumed: last starter)" : qb.source === "projected" ? " (projected)" : "";
  const first = qb.starts === 0 ? " · first start" : qb.change ? " · new starter" : "";
  const hurt = qb.injury_status ? ` · <b>${esc(qb.injury_status)} on the injury report</b>` : "";
  return `<b>${esc(qb.name || qb.id)}</b>${esc(src)}<div class="mini">${signed(qb.rating, 2)}&nbsp;EPA/dropback${esc(first)}</div>${hurt}`;
}

function injuryList(code, list, total) {
  if (!list || !list.length) return `<div class="panel"><div class="eyebrow">${esc(code)} injuries</div><div class="mini">None listed out, doubtful or questionable.</div></div>`;
  const items = list.map((i) => `<li><span><b>${esc(i.name)}</b> <span class="mini">${esc(i.position)}${i.injury ? ` · ${esc(i.injury)}` : ""}</span></span>
    <span class="end st ${esc(String(i.status).toLowerCase())}">${esc(i.status)}</span></li>`).join("");
  const more = total > list.length ? `<div class="mini">+${total - list.length} more on the report</div>` : "";
  return `<div class="panel"><div class="eyebrow">${esc(code)} injuries</div><ul class="list">${items}</ul>${more}</div>`;
}

// ---------------------------------------------------------------- players

// Key players, touchdown chances and news - shown, not applied: none of it
// moves the pick except the starting quarterback.
const AVAIL_WORD = { out: "Out", doubtful: "Doubtful", questionable: "Questionable", active: "" };

// "Most valuable player" reads as the league award; this is the team's own.
function alertLine(a) {
  return `<div class="alert ${esc(a.status)}"><b>${esc(a.team)} ${esc(a.name)}</b>
    <span class="mini">${esc(a.position)} · ${esc(a.role === "most valuable player" ? "team's top player" : a.role)}</span> - ${esc(a.reason || AVAIL_WORD[a.status] || a.status)}</div>`;
}
// Numbers keep their units on the same line ("185&nbsp;rush"). Applied after
// esc, so the entity is not escaped.
const nb = (h) => h.replace(/(\d) /g, "$1&nbsp;").replace(/ yds\b/g, "&nbsp;yds");

function statusBadge(p) {
  return p.status && p.status !== "active"
    ? ` <span class="st ${esc(p.status)}">${esc(AVAIL_WORD[p.status] || p.status)}</span>` : "";
}

// Projected yards, if he plays: the middle of what his usage points to.
function projText(pr) {
  if (!pr) return "";
  const parts = [];
  if (pr.pass_yds != null) parts.push(`${Math.round(pr.pass_yds)} pass`);
  if (pr.rush_yds != null && pr.rush_yds >= 5) parts.push(`${Math.round(pr.rush_yds)} rush`);
  if (pr.rec_yds != null && pr.rec_yds >= 5) parts.push(`${Math.round(pr.rec_yds)} rec`);
  return parts.length ? `proj. ${parts.join(" · ")} yds` : "";
}

function leadersList(code, leaders) {
  if (!leaders || !Object.keys(leaders).length) return "";
  const li = ["passing", "rushing", "receiving"].filter((k) => leaders[k]).map((k) => {
    const l = leaders[k];
    const result = l.played === false ? ` <span class="st questionable">Did not play</span>`
      : l.actual != null
      ? ` <span class="st ${l.over ? "scored" : "questionable"}">${Math.round(l.actual)} (${l.over ? "over" : "under"})</span>` : "";
    return `<li><span class="num lead">${Math.round(l.yards)}</span>
      <span><b>${esc(l.name)}</b> <span class="mini">${esc(l.position)}</span>${statusBadge(l)}${result}<div class="mini">${esc(k)} yards</div></span></li>`;
  }).join("");
  return `<div class="panel"><div class="eyebrow">${esc(code)} · projected leaders</div><ul class="list">${li}</ul></div>`;
}

function keyPlayers(code, kp) {
  if (!kp) return "";
  const off = (kp.offense || []).map((p) => `<li><span class="rk num">${esc(p.rank)}</span>
    <span><b>${esc(p.name)}</b> <span class="mini">${esc(p.position)}</span>${statusBadge(p)}
    <div class="mini">${signed(p.value, 1)}&nbsp;EPA · ${nb(esc(p.line))}</div>${p.proj ? `<div class="mini">${nb(esc(projText(p.proj)))}</div>` : ""}</span></li>`).join("");
  const dfn = (kp.defense || []).map((p) => `<li><span class="rk num">D</span>
    <span><b>${esc(p.name)}</b> <span class="mini">${esc(p.position)}</span>${statusBadge(p)}
    <div class="mini">${nb(esc(p.line))}</div></span></li>`).join("");
  if (!off && !dfn) return "";
  return `<div class="panel"><div class="eyebrow">${esc(code)} · most valuable</div><ul class="list">${off}${dfn}</ul></div>`;
}

// ---------------------------------------------------------------- touchdown meters

// Two meters from the live record, for a player or a team: of the times he
// was in our top 3 (and played), how often he scored; of the times he played
// outside it, how often he did not. A meter with no games is a dash, never 0%.
const TD_METER = {
  top3: { label: "Top 3 → scored", key: "scored" },
  rest: { label: "Not top 3 → no TD", key: "no_td" },
};
function meterCell(m, kind) {
  const k = TD_METER[kind];
  const n = m && m.n ? m.n : 0;
  const rate = n ? (m.rate != null ? m.rate : m[k.key] / n) : null;
  const value = n ? `<span class="x">${esc(m[k.key])} of ${esc(n)}</span><span class="sep"> · </span><b>${pct(rate)}</b>` : "—";
  return `<div class="m"><span class="l">${k.label}</span>
    <span class="bar${n ? "" : " none"}" aria-hidden="true"><i style="width:${n ? Math.round(rate * 100) : 0}%"></i></span>
    <span class="v num">${value}</span></div>`;
}
const tdMeters = (ms, cls = "") => !ms ? ""
  : `<div class="tdm${cls ? ` ${cls}` : ""}">${meterCell(ms.top3, "top3")}${meterCell(ms.rest, "rest")}</div>`;

// Why a listed player has no chance beside him: his group was measured and
// the model's number for it was off (Record has the figures).
const UNPRICED = { "no history": "no NFL game yet, not priced" };
const unpricedWhy = (p) => UNPRICED[p.group] || "too little used to price";

function tdItem(p) {
  const result = p.played === false ? ` <span class="st questionable">Did not play</span>`
    : p.scored === true ? ` <span class="st scored">Scored</span>`
    : p.scored === false ? ` <span class="st questionable">No TD</span>` : "";
  const season = p.games_season ? `${esc(p.tds_season)} TD in ${esc(p.games_season)} games this season` : "";
  const why = p.prob == null ? unpricedWhy(p) : "";
  const note = [season, why].filter(Boolean).join(" · ");
  const chance = p.prob == null ? `<span class="num lead dim" title="${esc(unpricedWhy(p))}">—</span>`
    : `<span class="num lead">${pct(p.prob)}</span>`;
  return `<li class="tdp">${chance}
    <span class="who"><b>${esc(p.name)}</b> <span class="mini">${esc(p.position)}</span>${statusBadge(p)}${result}${note ? `<div class="mini">${note}</div>` : ""}</span>
    ${tdMeters(p.meters)}</li>`;
}

const tdCount = (g) => ["away", "home"].reduce((n, s) => n + (g[`${s}_td_all`] || g[`${s}_td`] || []).length, 0);

const TD_LEGEND = `Top 3 → scored: of the games a player was in our top 3 and played, how many he scored in.
  Not top 3 → no TD: of the games he played outside it, how many he did not score in. From the live record,
  picks logged before kickoff; a dash means no such game yet.`;
function tdLegend(c) {
  c = c || {};
  const body = [c.td, c.td_meters].filter(Boolean).map((t) => `<p style="margin:0">${esc(t)}</p>`).join("");
  return `<div class="mini tdlegend">${esc(TD_LEGEND)}</div>${fold(c.td_list || c.td, body)}`;
}

// One team's touchdown list: our top 3 first, then - folded, so the card
// stays short - everyone else a bettor can back to score.
function tdList(code, top, all, team, open = false) {
  if (!top || !top.length) return "";
  const ids = new Set(top.map((p) => p.gsis_id));
  const rest = (all || []).filter((p) => !ids.has(p.gsis_id));
  const more = rest.length
    ? (open
      ? `<div class="tdhead mini">Everyone else you can bet on · ${rest.length}</div><ul class="list">${rest.map(tdItem).join("")}</ul>`
      : `<details class="tdmore"><summary><span>${rest.length} more you can bet on</span><span class="more">Show</span></summary>
        <ul class="list">${rest.map(tdItem).join("")}</ul></details>`)
    : all ? "" : `<div class="mini">Only our top 3 were logged for this game.</div>`;
  const teamLine = team ? `<div class="tdteam"><span class="mini">${esc(code)}, every game so far</span>${tdMeters(team)}</div>` : "";
  return `<div class="panel"><div class="eyebrow">${esc(code)} · touchdown</div>${teamLine}
    <div class="tdhead mini">Our top 3</div><ul class="list">${top.map(tdItem).join("")}</ul>${more}</div>`;
}

// One line on the closed card: each team's likeliest scorer.
function tdPeek(g) {
  const first = (side) => (g[`${side}_td`] || [])[0];
  const parts = ["away", "home"].map((side) => {
    const p = first(side);
    return p ? `<span class="nowrap"><b>${esc(g[side])}</b> ${esc(p.name)} <span class="num">${p.prob == null ? "—" : pct(p.prob)}</span>${
      p.scored === true ? " ✓" : p.scored === false ? " ✗" : ""}</span>` : "";
  }).filter(Boolean);
  return parts.length ? `<div class="tdpeek mini"><span class="eyebrow" style="margin-right:4px">Likeliest TD</span>${parts.join(" · ")}</div>` : "";
}

function newsList(items) {
  if (!items || !items.length) return "";
  const li = items.map((n) => {
    const safe = /^https?:\/\//.test(n.link || "");
    const title = safe ? `<a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>` : esc(n.title);
    const who = (n.players || []).length ? ` · ${esc(n.players.join(", "))}` : "";
    return `<li><span>${title}<div class="mini">${esc(n.source)} · ${esc(DESK.ago(n.published))}${who}</div></span></li>`;
  }).join("");
  return `<div class="panel news"><div class="eyebrow">Player news · shown, not applied</div><ul class="list">${li}</ul></div>`;
}

// ---------------------------------------------------------------- same-game tickets
// sgp:begin - the four same-game tickets of a game (nfl_sgp), in its detail and on
// the Parlays tab. Every number is read from week.json - its "sgp" block and
// each game's "tickets" - and a number that is missing is shown with the
// payload's own reason. Nothing is typed here that the payload could say, so
// the rule and the app cannot drift apart. test_nfl_app.py renders this in node.

// The order the tickets read in, smallest first. The rule builds them in its
// own order (sgp.kinds), which the slot caveat states.
const SGP_SHOWN = ["small", "medium", "large", "rookie"];
function sgpOrder(kinds) {
  const k = kinds && kinds.length ? kinds : SGP_SHOWN;
  return [...SGP_SHOWN.filter((x) => k.includes(x)), ...k.filter((x) => !SGP_SHOWN.includes(x))];
}
const kindName = (k) => String(k).charAt(0).toUpperCase() + String(k).slice(1);
// Every price the tickets carry is the books' consensus, not Stake's.
const EST = ` <span class="est">est.</span>`;
const money = (x) => (x == null ? "—" : `$${Number(x).toFixed(2)}`);
// Rounded before the sign is taken, as signed() does.
const signedMoney = (x) => {
  if (x == null) return "—";
  const r = Number(Number(x).toFixed(2));
  return r === 0 ? money(0) : `${r > 0 ? "+" : "−"}${money(Math.abs(r))}`;
};
// The stake a meter or a ticket is priced at, as the payload gives it.
const stakeWord = (x) => (x == null ? "—" : `$${Number.isInteger(Number(x)) ? Number(x) : Number(x).toFixed(2)}`);
const dateOnly = (iso) => {
  const t = new Date(iso);
  return Number.isNaN(t.getTime()) ? String(iso || "") : t.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
};
const tally = (n) => (n == null ? "—" : Number(n).toLocaleString());
// A decimal price as American odds: what nfl_sgp.decimal_from_american undoes.
const americanOf = (dec) => (dec == null || !(dec > 1) ? null : dec >= 2 ? (dec - 1) * 100 : -100 / (dec - 1));

// What the user types for Stake's quote: decimal as Stake shows it (4.50,
// or 4,50), or American with its sign (+450, -120, or a typographic minus;
// a comma there is a thousands separator). A bare number is read as
// decimal, and the reading is echoed back, so a price is never silently
// taken the other way.
const ODDS_HELP = "That is not a price: type the odds as Stake shows them - decimal, or American with its sign (+ or −).";
function parseOdds(text) {
  let t = String(text ?? "").trim().replace(/[\u2212\u2012\u2013\u2014]/g, "-").replace(/\s+/g, "");
  if (!t) return null;
  t = /^[+-]/.test(t) ? t.replace(/,/g, "") : t.replace(",", ".");
  if (/^[+-]\d+(\.\d+)?$/.test(t)) {
    const a = Number(t);
    if (Math.abs(a) < 100) return { error: ODDS_HELP };
    return { decimal: 1 + (a > 0 ? a / 100 : 100 / -a), american: a };
  }
  if (/^(\d+\.?\d*|\.\d+)$/.test(t)) {
    const d = Number(t);
    return d > 1 ? { decimal: d, american: americanOf(d) } : { error: ODDS_HELP };
  }
  return { error: ODDS_HELP };
}
function parseStake(text) {
  const t = String(text ?? "").trim().replace(/^\$/, "").replace(",", ".");
  if (!/^(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  const v = Number(t);
  return v > 0 && Number.isFinite(v) ? v : null;
}

// What the user typed for a ticket stays on this phone (localStorage, through
// DESK.store, which survives private mode) and is never sent anywhere. The
// key carries the ticket's legs: a slip rebuilt before kickoff starts empty.
const sgpId = (g, t) => [g.game_id, t.kind, t.version || "", (t.legs || []).map((l) => l.key).join("+")].join("|");
function sgpSaved(id) {
  try { return JSON.parse(DESK.store.get(`yournfl.sgp.${id}`) || "null"); } catch (e) { return null; }
}
const sgpSave = (id, v) => DESK.store.set(`yournfl.sgp.${id}`, JSON.stringify(v));

// The exact return of the slip at the odds typed: the stake times Stake's
// decimal price. Exact because it is Stake's own quote, not an estimate.
function stakeResult(oddsText, stakeText) {
  const o = parseOdds(oddsText);
  if (!o) return `<span class="mini">Type the odds Stake's bet builder quotes for this slip to see what it pays.</span>`;
  if (o.error) return `<span class="mini warn">${esc(o.error)}</span>`;
  const st = parseStake(stakeText);
  if (st == null) return `<span class="mini warn">Type an amount above zero.</span>`;
  const pays = st * o.decimal;
  return `<span>Pays <b class="num">${money(pays)}</b> · profit <b class="num">${signedMoney(pays - st)}</b> <span class="mini">exact</span></span>
    <span class="mini">${money(st)} at ${num(o.decimal)} decimal (${esc(odds(o.american))}) · Stake's price implies ${pct(1 / o.decimal, 1)}</span>`;
}

function stakeBox(g, t, s) {
  const id = sgpId(g, t);
  const saved = sgpSaved(id) || {};
  const amount = saved.stake != null ? saved.stake : (s && s.stake != null ? String(s.stake) : "");
  const fair = t.chance ? 1 / t.chance : null;
  return `<div class="stakebox" data-sgp-id="${esc(id)}">
    <div class="sx">
      <label class="field"><span class="lab">Odds on Stake</span><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" data-sgp-odds value="${esc(saved.odds || "")}"></label>
      <label class="field"><span class="lab">Amount ($)</span><input type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" data-sgp-stake value="${esc(amount)}"></label>
    </div>
    <div class="sx-out" data-sgp-out aria-live="polite">${stakeResult(saved.odds, amount)}</div>
    <div class="mini">Fair odds at the product chance: <b class="num">${num(fair)}</b> (${esc(odds(americanOf(fair)))}). The chance assumes the legs are independent; legs in one game are not. What you type stays on this phone.</div>
  </div>`;
}

// One box per ticket, maybe drawn twice (the game's detail and the Parlays
// tab): typing in one saves it and redraws every box of the same ticket.
document.addEventListener("input", (e) => {
  const box = e.target && e.target.closest && e.target.closest(".stakebox");
  if (!box) return;
  const id = box.getAttribute("data-sgp-id");
  const oddsText = box.querySelector("[data-sgp-odds]").value;
  const stakeText = box.querySelector("[data-sgp-stake]").value;
  sgpSave(id, { odds: oddsText, stake: stakeText });
  document.querySelectorAll(".stakebox").forEach((b) => {
    if (b.getAttribute("data-sgp-id") !== id) return;
    if (b !== box) {
      b.querySelector("[data-sgp-odds]").value = oddsText;
      b.querySelector("[data-sgp-stake]").value = stakeText;
    }
    b.querySelector("[data-sgp-out]").innerHTML = stakeResult(oddsText, stakeText);
  });
});

const SGP_RESULT = { won: ["good", "Won"], lost: ["bad", "Lost"], void: ["flat", "Void"] };
const resultChip = (r) => (SGP_RESULT[r] ? ` <span class="tag ${SGP_RESULT[r][0]}">${SGP_RESULT[r][1]}</span>` : "");

function legItem(leg, result) {
  const who = leg.kind === "TD"
    ? `<b>${esc(leg.name)}</b> <span class="mini">${esc([leg.position, leg.team].filter(Boolean).join(" · "))} · anytime TD</span>${leg.rookie ? ` <span class="tag accent">Rookie</span>` : ""}`
    : leg.kind === "WIN" ? `<b>${esc(leg.label)}</b>`
    : `<b>${leg.kind === "SPREAD" ? esc(line(leg.team, leg.line)) : esc(leg.label)}</b> <span class="mini">${esc(String(leg.kind).toLowerCase())}</span>`;
  const notes = [];
  if (leg.kind === "TD") notes.push("chance if he plays");
  if (leg.decimal == null) notes.push(`no price: ${esc(leg.price_missing || "none on file")}`);
  if (leg.kind === "TD" && leg.best_american != null) {
    notes.push(`best ${esc(odds(leg.best_american))}${leg.est ? EST : ""}${leg.best_book ? ` (${esc(leg.best_book)})` : ""}${leg.books ? ` of ${esc(leg.books)} books` : ""}`);
  }
  if (leg.kind === "TD" && leg.price_as_of) notes.push(`priced ${esc(localStamp(leg.price_as_of))}`);
  const price = leg.decimal != null
    ? `<span class="num">${esc(odds(leg.american))}</span><span class="dec"><span class="mini num"> ${num(leg.decimal)}</span>${leg.est ? EST : ""}</span>`
    : `<span class="mini">no price</span>`;
  return `<li><span class="num lead">${pct(leg.chance)}</span>
    <span class="who">${who}${resultChip(result)}${notes.length ? `<div class="mini">${notes.join(" · ")}</div>` : ""}</span>
    <span class="end">${price}</span></li>`;
}

// The kind's measured record beside a ticket's product chance: over the
// history's widest span, and in the chance bin the ticket falls in.
function widestPeriod(periods) {
  const all = Object.entries(periods || {});
  return all.reduce((best, p) => (!best || (p[1][1] - p[1][0]) > (best[1][1] - best[1][0]) ? p : best), null);
}
const spanLabel = (lohi) => (!lohi ? "" : lohi[0] === lohi[1] ? String(lohi[0]) : `${lohi[0]}-${lohi[1]}`);
function kindRecord(kind, chance, s) {
  const h = s && s.history;
  if (!h) return "";
  if (!h.available) return `<div class="mini">Measured hit rate: none yet - ${esc(h.reason)}</div>`;
  const span = widestPeriod(h.periods);
  const k = (h.kinds || {})[kind] || {};
  const m = span && (k.meters || {})[span[0]];
  if (!m) return "";
  if (m.hit_rate == null) return `<div class="mini">Measured hit rate: ${esc(m.hit_rate_reason)}</div>`;
  const bins = k.chance_bins || [];
  const bin = chance == null ? null : bins.find((b, i) => chance >= b.lo && (chance < b.hi || (i === bins.length - 1 && chance <= b.hi)));
  return `<div class="mini">${esc(kindName(kind))} tickets hit <b>${pct(m.hit_rate, 1)}</b> of ${tally(m.won + m.lost)} in the ${esc(spanLabel(span[1]))} replay, where their product said ${pct(m.mean_chance, 1)}${
    bin ? `; at a product of ${pct(bin.lo)}-${pct(bin.hi)} they hit ${pct(bin.hit_rate, 1)} of ${tally(bin.tickets)}` : ""}.</div>`;
}

function ticketCard(g, t, s) {
  const n = (s && s.legs && s.legs[t.kind]) || (t.legs || []).length;
  const rule = ((s && s.caveats && s.caveats.tickets) || {})[t.kind];
  const head = `<div class="tkt-head"><b>${esc(kindName(t.kind))}</b><span class="mini">${esc(n)} legs</span>${resultChip(t.result)}</div>
    ${rule ? `<div class="mini">${esc(rule)}</div>` : ""}`;
  if (!t.built) return `<div class="tkt off" data-kind="${esc(t.kind)}">${head}<div class="mini"><b>Not built:</b> ${esc(t.reason)}</div></div>`;
  const results = t.leg_results || {};
  const stake = s && s.stake;
  const est = t.est_payout != null && stake != null
    ? `${esc(stakeWord(stake))} returns <b class="num">${money(stake * t.est_payout)}</b>${EST} <span class="mini">at ${num(t.est_payout)} decimal (${esc(odds(americanOf(t.est_payout)))}), the product of the legs' prices</span>`
    : `<span class="mini">${t.est_payout != null ? `${num(t.est_payout)} decimal${EST}` : `no est. payout: ${esc(t.est_payout_reason)}`}</span>`;
  const paid = t.result === "won" && t.payout != null && stake != null
    ? `<div class="mini">Graded: returned ${money(stake * t.payout)}${EST} on the legs that stood</div>`
    : t.result === "void" ? `<div class="mini">Graded: every leg voided, stake back</div>` : "";
  return `<div class="tkt" data-kind="${esc(t.kind)}">${head}
    <ul class="list legs">${t.legs.map((leg) => legItem(leg, results[leg.key])).join("")}</ul>
    <div class="tkt-row"><span class="k">Chance</span><span><b class="num">${pct(t.chance, 1)}</b> <span class="mini">the product of the legs' chances</span>${kindRecord(t.kind, t.chance, s)}</span></div>
    <div class="tkt-row"><span class="k">Payout</span><span>${est}${paid}</span></div>
    ${t.version && s && s.version && t.version !== s.version ? `<div class="mini">Built by rule ${esc(t.version)}; this week's rule is ${esc(s.version)}.</div>` : ""}
    ${stakeBox(g, t, s)}
  </div>`;
}

// A game's tickets in reading order, or why it has none.
function ticketsHtml(g, s) {
  if (!g.tickets) return g.tickets_reason ? `<div class="mini">${esc(g.tickets_reason)}</div>` : "";
  const order = sgpOrder(s && s.kinds);
  const sorted = [...g.tickets].sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
  return `<div class="tkts">${sorted.map((t) => ticketCard(g, t, s)).join("")}</div>`;
}

// The rule's own words: how each leg's chance and price are read, how the
// slots are filled, what v1 leaves out.
const LEG_SHOWN = ["WIN", "SPREAD", "TOTAL", "TD"];
function sgpRules(s, shown = []) {
  const c = (s && s.caveats) || {};
  const legKinds = Object.keys(c.legs || {});
  const legs = [...LEG_SHOWN.filter((k) => legKinds.includes(k)), ...legKinds.filter((k) => !LEG_SHOWN.includes(k))]
    .map((k) => `<dt><b>${esc(k)}</b></dt><dd>${esc(c.legs[k])}</dd>`).join("");
  const tickets = sgpOrder(s && s.kinds).filter((k) => (c.tickets || {})[k])
    .map((k) => `<dt><b>${esc(kindName(k))}</b></dt><dd>${esc(c.tickets[k])}</dd>`).join("");
  const body = ["slots", "chance", "est", "prices", "exact", "rookie", "not_in_v1"].filter((k) => c[k] && !shown.includes(k))
    .map((k) => c[k])
    .map((x) => `<p style="margin:0">${esc(x)}</p>`).join("");
  return fold(`How the tickets are built${s && s.version ? ` (rule ${s.version})` : ""}: the legs, the slots, the chance and the price.`,
    `${tickets ? `<dl class="gloss">${tickets}</dl>` : ""}${legs ? `<dl class="gloss">${legs}</dl>` : ""}${body}`);
}

// The game's detail: its tickets, the no-edge line and the est. caveat beside them.
function sgpSection(g, d) {
  const s = d && d.sgp;
  const body = ticketsHtml(g, s);
  if (!body || !g.tickets) return body;
  const c = (s && s.caveats) || {};
  return `${body}${c.edge ? `<div class="note">${esc(c.edge)}</div>` : ""}${c.est ? `<div class="mini">${esc(c.est)}</div>` : ""}${sgpRules(s, ["est"])}`;
}
const sgpTitle = (g) => {
  const t = g.tickets || [];
  return t.length ? `Parlays · ${t.filter((x) => x.built).length} of ${t.length} built` : "Parlays";
};

// One kind's meter: won of built, the hit rate beside the product chance,
// and the return at the stake per ticket - or each one's reason.
function sgpMeter(m, estimated) {
  if (!m) return `<div class="mini">—</div>`;
  const extra = [m.lost ? `${tally(m.lost)} lost` : "", m.void ? `${tally(m.void)} void` : "",
    m.pending ? `${tally(m.pending)} to grade` : ""].filter(Boolean).join(" · ");
  const bar = m.hit_rate == null ? `<span class="bar none" aria-hidden="true"></span>`
    : `<span class="bar" aria-hidden="true"><i style="width:${Math.round(m.hit_rate * 100)}%"></i>${
      m.mean_chance != null ? `<s style="left:${Math.round(m.mean_chance * 100)}%"></s>` : ""}</span>`;
  const hit = m.hit_rate != null
    ? `hit <b>${pct(m.hit_rate, 1)}</b> <span class="mini">· product said ${pct(m.mean_chance, 1)}</span>`
    : `<span class="mini">hit rate: ${esc(m.hit_rate_reason)}</span>`;
  const roi = m.roi != null
    ? `profit <b class="num">${signedMoney(m.profit)}</b> · ROI <b class="num">${signed(m.roi * 100, 1)}%</b>${estimated ? EST : ""}`
    : `<span class="mini">no return: ${esc(m.roi_reason)}</span>`;
  const why = Object.entries(m.not_built_why || {}).map(([w, n]) => `${esc(w)} (${tally(n)})`).join("; ");
  return `<div class="sgpm-v"><span><b class="num">${tally(m.won)}</b> won of <b class="num">${tally(m.tickets)}</b> built${extra ? ` <span class="mini">· ${extra}</span>` : ""}</span>
    ${bar}<span>${hit}</span>
    <span>${esc(stakeWord(m.stake))} a ticket: ${roi}</span>
    ${m.not_built ? `<span class="mini">Not built ${tally(m.not_built)}: ${why}</span>` : ""}</div>`;
}

// Every period of the history for one kind, and its product chance against
// how often it hit.
function sgpPeriods(h, kind) {
  const k = (h.kinds || {})[kind] || {};
  const whole = (widestPeriod(h.periods) || [])[0];
  const spans = Object.entries(h.periods || {}).sort((a, b) => (a[0] === whole) - (b[0] === whole) || a[1][0] - b[1][0] || a[1][1] - b[1][1]);
  const rows = spans.map(([name, lohi]) => {
    const m = (k.meters || {})[name];
    if (!m) return "";
    return `<tr><td class="nowrap">${esc(spanLabel(lohi))}</td><td class="n">${tally(m.tickets)}</td><td class="n">${tally(m.won)}</td>
      <td class="n">${pct(m.hit_rate, 1)}</td><td class="n">${pct(m.mean_chance, 1)}</td><td class="n">${m.roi == null ? "—" : `${signed(m.roi * 100, 1)}%`}</td></tr>`;
  }).join("");
  const reasons = [...new Set(spans.map(([name]) => ((k.meters || {})[name] || {}).roi_reason).filter(Boolean))];
  const bins = (k.chance_bins || []).map((b) => `<tr><td class="n">${pct(b.lo)}-${pct(b.hi)}</td><td class="n">${tally(b.tickets)}</td>
    <td class="n">${pct(b.mean_chance, 1)}</td><td class="n">${pct(b.hit_rate, 1)}</td></tr>`).join("");
  return `${rows ? `<div class="scroll"><table class="tight"><thead><tr><th>Seasons</th><th class="n">Built</th><th class="n">Won</th><th class="n">Hit</th><th class="n">Said</th><th class="n">ROI</th></tr></thead><tbody>${rows}</tbody></table></div>` : ""}
    ${reasons.length ? `<div class="mini">ROI: ${reasons.map(esc).join("; ")}.</div>` : ""}
    ${bins ? `<div class="eyebrow" style="margin-top:4px">Product chance against hits, ${esc(spanLabel((widestPeriod(h.periods) || [])[1]))}</div>
      <div class="scroll"><table class="tight"><thead><tr><th class="n">Product</th><th class="n">Tickets</th><th class="n">Said</th><th class="n">Hit</th></tr></thead><tbody>${bins}</tbody></table></div>` : ""}`;
}

// The four meters: each kind on its own, the history replay and this season live.
function sgpMeters(d) {
  const s = d.sgp;
  if (!s) return `<div class="card"><h2>How each kind has done</h2>
    <div class="note">This week's file was written before the same-game tickets existed, so it has none; the next run adds them.</div></div>`;
  const h = s.history || {}, live = s.live || {}, c = s.caveats || {};
  const span = h.available ? widestPeriod(h.periods) : null;
  const left = Object.entries(h.left_out || {}).map(([w, n]) => `${esc(w)} (${tally(n)})`).join("; ");
  const histHead = h.available
    ? `<div class="mini">History: the backtest replay of ${tally((h.games || {})[span ? span[0] : ""])} games, ${esc(spanLabel(span && span[1]))}, through the games of ${esc(dateOnly(h.through))} · replayed ${esc(DESK.ago(h.generated))}${left ? ` · left out: ${left}` : ""}.</div>`
    : `<div class="note">No history yet: ${esc(h.reason)}.</div>`;
  const liveHead = `<div class="mini">Live: ${tally(live.games)} games' tickets logged before kickoff${live.first_kickoff ? ` since ${esc(localStamp(live.first_kickoff))}` : ""}, ${tally(live.graded_games)} graded.</div>`;
  const panels = sgpOrder(s.kinds).map((kind) => {
    const hm = h.available && span ? (((h.kinds || {})[kind] || {}).meters || {})[span[0]] : null;
    const lm = (live.kinds || {})[kind];
    return `<div class="panel sgpm" data-kind="${esc(kind)}"><div class="eyebrow">${esc(kindName(kind))} · ${esc((s.legs || {})[kind] ?? "—")} legs</div>
      <div class="sgpm-l">History, ${esc(h.available ? spanLabel(span && span[1]) : "none yet")}</div>
      ${h.available ? sgpMeter(hm, false) : `<div class="mini">${esc(h.reason)}</div>`}
      <div class="sgpm-l">Live${live.first_kickoff ? ` since ${esc(dateOnly(live.first_kickoff))}` : ""}</div>
      ${sgpMeter(lm, true)}
      ${h.available ? DESK.sub("Every period", sgpPeriods(h, kind)) : ""}
    </div>`;
  }).join("");
  const inputs = Object.entries(h.inputs || {}).map(([k, v]) => `<dt><b>${esc(k)}</b></dt><dd>${esc(v)}</dd>`).join("");
  const g = h.td_groups || {};
  const groups = g.note ? `${g.note}${g.tickets != null ? ` - here ${tally(g.changed)} of ${tally(g.tickets)} built tickets${(g.shipped || []).length ? `; groups given a chance: ${g.shipped.join(", ")}` : ""}` : ""}.` : "";
  const more = [c.live, groups].filter(Boolean).map((x) => `<p style="margin:0">${esc(x)}</p>`).join("")
    + (inputs ? `<dl class="gloss">${inputs}</dl>` : "");
  return `<div class="card" id="sgp-meters"><h2>How each kind has done</h2>
    ${histHead}${liveHead}
    <div class="two">${panels}</div>
    ${c.bias ? `<div class="note warnbox">${esc(c.bias)}</div>` : ""}
    ${fold(c.meters || "", more)}
  </div>`;
}

function gameRow(g, d) {
  const p = g.home_prob;
  const bar = p == null
    ? `<div class="probbar none"><i style="flex:1"></i></div>`
    : `<div class="probbar${g.pick ? " has-pick" : ""}" role="img" aria-label="${esc(g.away)} ${pct(1 - p)}, ${esc(g.home)} ${pct(p)}"><i class="b${g.pick === g.away ? " pk" : ""}" style="flex:${1 - p}"></i><i class="r${g.pick === g.home ? " pk" : ""}" style="flex:${p}"></i></div>`;
  const ph = phase(g);
  const statusWord = STATUS_WORD[ph] || "";
  const status = statusWord
    ? `<span class="badge ${ph === "final" ? "" : "live"}">${esc(statusWord)}</span>` : "";
  const extra = [g.neutral ? "Neutral site" : "", g.div_game ? "Division" : ""].filter(Boolean)
    .map((x) => `<span class="badge">${esc(x)}</span>`).join("");

  // Chips for the band and for trouble only. News and the injury report sit
  // in the opened game: every game has both, so a chip said nothing.
  const tags = [];
  if (g.tier) tags.push(`<span class="tag ${TIER_TONE[g.tier] || "flat"}" title="Picks in this band won ${pct(g.tier_hit_rate, 1)} of 2016-2025 games">${esc(g.tier)}</span>`);
  const m = g.market || {};
  const pickOdds = g.pick === g.home ? m.home_ml : g.pick === g.away ? m.away_ml : null;
  for (const side of ["away", "home"]) {
    const qb = g[`${side}_qb`];
    if (qb && qb.injury_status) tags.push(`<span class="tag warn">${esc(g[side])} QB ${esc(qb.injury_status)}</span>`);
    if (qb && qb.replaced) tags.push(`<span class="tag warn">${esc(g[side])} backup QB</span>`);
  }
  // A top player out gets a chip only when the alert lines above do not
  // already say so.
  const shown = (g.alerts || []).slice(0, 2);
  const mvpOut = (g.alerts || []).filter((a) => a.role === "most valuable player" && a.status !== "questionable" && !shown.includes(a));
  for (const a of mvpOut) tags.push(`<span class="tag bad">${esc(a.team)} top player ${esc(AVAIL_WORD[a.status] || a.status)}</span>`);
  const injured = (g.home_injuries_total ?? (g.home_injuries || []).length)
    + (g.away_injuries_total ?? (g.away_injuries || []).length);
  tags.push(resultTag(g));

  const pickLine = g.pick
    ? `<span class="pick">${icon("check")}<span class="sr">Pick: </span>${esc(g.pick)}${
        pickOdds != null ? `<span class="odds num">${esc(odds(pickOdds))}</span>` : ""}</span>${tags.join("")}`
    : `<span class="mini">${esc(g.no_pick_reason || "No pick.")}</span>${tags.join("")}`;

  const sp = g.spread_pick, tp = g.total_pick;
  const kv = [
    ["Pick", g.pick ? `<b>${esc(g.pick)}</b> <span class="num">${pct(g.pick_prob, 1)}</span> <span class="mini">${g.market_prob == null ? "model alone - no market price" : "model and market blended"}</span>` : "—"],
    ["Band", g.tier ? `${esc(g.tier)} <span class="mini">picks in this band won ${pct(g.tier_hit_rate, 1)} of 2016-2025 games</span>` : "—"],
    ["Model alone", g.model_prob == null ? "—" : `${esc(g.away)} ${pct(1 - g.model_prob, 1)} · ${esc(g.home)} ${pct(g.model_prob, 1)}`],
    ["Market", g.market_prob == null ? "—" : `${esc(g.away)} ${pct(1 - g.market_prob, 1)} · ${esc(g.home)} ${pct(g.market_prob, 1)} <span class="mini">bookmaker's cut removed, ${esc(m.source === "the-odds-api" ? `${m.books ?? "?"} books` : "schedule line")}</span>`],
    ["Moneyline", m.home_ml == null ? "—" : `<span class="nowrap">${esc(g.away)} ${esc(odds(m.away_ml))}</span> · <span class="nowrap">${esc(g.home)} ${esc(odds(m.home_ml))}</span>`
      + (m.best_away_ml != null && m.best_home_ml != null ? ` <span class="mini">best <span class="nowrap">${esc(g.away)} ${esc(odds(m.best_away_ml))}${
        m.best_away_book ? ` (${esc(m.best_away_book)})` : ""}</span> · <span class="nowrap">${esc(g.home)} ${esc(odds(m.best_home_ml))}${
        m.best_home_book ? ` (${esc(m.best_home_book)})` : ""}</span></span>` : "")],
    ["Spread", (g.market_spread == null ? (g.model_spread == null ? "—" : `model: ${marginText(g, g.model_spread)}`)
      : `${esc(line(g.home, -g.market_spread))} <span class="mini">market</span> · model: ${marginText(g, g.model_spread)}`)
      + (m.opening_spread != null && m.opening_spread !== g.market_spread ? ` <span class="mini nowrap">first priced ${esc(line(g.home, -m.opening_spread))}</span>` : "")
      + (sp ? `<div class="mini">Model's side: ${esc(line(sp.team, sp.line))}, ${num(sp.edge, 1)}&nbsp;pts off the line</div>` : "")],
    ["Total", (g.market_total == null ? (g.model_total == null ? "—" : `model ${num(g.model_total, 1)}`)
      : `${num(g.market_total, 1)} <span class="mini">market</span> · model ${num(g.model_total, 1)}`)
      + (m.opening_total != null && m.opening_total !== g.market_total ? ` <span class="mini nowrap">first priced ${num(m.opening_total, 1)}</span>` : "")
      + (tp ? `<div class="mini">Model's side: ${esc(String(tp.side).toLowerCase())}</div>` : "")],
    ["Rest", `${esc(g.away)} ${g.away_rest == null ? "—" : Math.round(g.away_rest) + " days"} · ${esc(g.home)} ${g.home_rest == null ? "—" : Math.round(g.home_rest) + " days"}`],
    ["Elo", `${esc(g.away)} ${num(g.elo && g.elo.away, 0)} · ${esc(g.home)} ${num(g.elo && g.elo.home, 0)}`],
    ["Venue", `${esc(g.stadium || "—")}${g.roof ? ` · ${esc(g.roof)}` : ""}`],
  ];
  if (m.as_of) kv.push(["Prices", esc(localStamp(m.as_of))]);
  if (g.logged_at) kv.push(["Logged", `${esc(localStamp(g.logged_at))} <span class="mini">before kickoff</span>`]);

  const qbAlert = ["away", "home"].some((s) => g[`${s}_qb`] && g[`${s}_qb`].injury_status)
    ? `<div class="note warnbox">${esc(d.caveats.qb)}</div>` : "";

  // The pick first: who, how sure, the prices. How the number is built is
  // one tap away; the reference sections below are folded to their titles.
  const LEAD = ["Pick", "Band", "Moneyline", "Spread", "Total"];
  const rows = (l) => l.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");
  const pickPanel = `<div class="panel"><div class="eyebrow">The pick</div>
      <dl class="kv">${rows(kv.filter(([k]) => LEAD.includes(k)))}</dl>
      ${(sp || tp) && d.caveats && d.caveats.lines ? `<div class="mini">${esc(d.caveats.lines)}</div>` : ""}
      <details class="fold"><summary><span class="clip">How the number is built: model alone, market, Elo, rest, venue, when priced</span><span class="more">Show</span></summary>
        <div class="fold-body" style="padding-left:14px"><dl class="kv">${rows(kv.filter(([k]) => !LEAD.includes(k)))}</dl></div></details>
    </div>`;
  const kp = keyPlayers(g.away, g.away_players) + keyPlayers(g.home, g.home_players);
  const forms = formDetail(g.away, g.away_form) + formDetail(g.home, g.home_form);

  return `<details class="match" data-status="${esc(ph)}">
    <summary>
      <div class="match-top"><span class="when">${esc(kickTime(g.kickoff))}</span>${status}${extra}<span class="chev">${icon("chevron")}</span></div>
      <div class="sides">${teamRow(g, "away")}${teamRow(g, "home")}</div>
      ${bar}
      <div class="pickline">${pickLine}</div>
      ${tdPeek(g)}
      ${(g.alerts || []).slice(0, 2).map(alertLine).join("")}
      ${(g.alerts || []).length > 2 ? `<div class="mini">+${g.alerts.length - 2} more in the detail</div>` : ""}
    </summary>
    <div class="detail">
      ${pickPanel}
      <div class="panel"><div class="eyebrow">Quarterbacks</div>
        <dl class="kv"><dt>${esc(g.away)}</dt><dd>${qbText(g.away_qb)}</dd><dt>${esc(g.home)}</dt><dd>${qbText(g.home_qb)}</dd></dl></div>
      ${qbAlert}
      ${(g.alerts || []).length > 2 ? g.alerts.slice(2).map(alertLine).join("") : ""}
      ${DESK.sub(`Injury report · ${injured ? `${injured} listed` : "none listed"} · shown, not applied`,
        `<div class="two">${injuryList(g.away, g.away_injuries, g.away_injuries_total)}${injuryList(g.home, g.home_injuries, g.home_injuries_total)}</div>`)}
      ${DESK.sub(`Player news · ${(g.news || []).length} · shown, not applied`, newsList(g.news))}
      ${DESK.sub("Most valuable players", kp && `<div class="two">${kp}</div>`)}
      ${DESK.sub(`Touchdown chances${tdCount(g) ? ` · ${tdCount(g)} players` : ""}`, (g.away_td || g.home_td) && `<div class="two">${
        tdList(g.away, g.away_td, g.away_td_all, (g.td_meters || {}).away)}${tdList(g.home, g.home_td, g.home_td_all, (g.td_meters || {}).home)}</div>
        ${tdLegend(d.caveats)}`)}
      ${DESK.sub("Projected yards", (g.away_leaders || g.home_leaders) && `<div class="two">${leadersList(g.away, g.away_leaders)}${leadersList(g.home, g.home_leaders)}</div>
        <div class="mini">${esc((d.caveats && d.caveats.props) || "")}</div>`)}
      ${DESK.sub(esc(sgpTitle(g)), sgpSection(g, d))}
      ${DESK.sub("Last 5 games", forms && `<div class="two">${forms}</div>`)}
      ${DESK.closer(`${g.away} at ${g.home}`)}
    </div>
  </details>`;
}

function upsetCard(games) {
  const open = games.filter((g) => phase(g) === "upcoming" && g.pick && g.pick_prob != null)
    .sort((a, b) => a.pick_prob - b.pick_prob).slice(0, 6);
  if (!open.length) return "";
  const items = open.map((g) => {
    const opp = g.pick === g.home ? g.away : g.home;
    const wrong = 1 - g.pick_prob;
    return `<li><span><b>${esc(g.pick)}</b> <span class="mini">over ${esc(opp)}</span></span>
      <span class="num ${wrong >= 0.4 ? "warn" : "flat"}">${pct(wrong)}</span>
      <span class="meter ${wrong >= 0.4 ? "" : "flat"}" aria-hidden="true"><i style="width:${Math.round(wrong * 100)}%"></i></span></li>`;
  }).join("");
  return `<div class="card"><h2>Upset watch</h2>
    <div class="mini">Chance each pick is wrong, most doubtful first.</div>
    <ul class="rank">${items}</ul>
    ${fold("The probabilities are calibrated: picks the model gave about 60% won about 59% of 2016-2025 games.")}</div>`;
}

let WEEK = null;
// The header's second line: when the picks were made and how far the data runs.
function stamp() {
  const s = $("stamp");
  if (!s || !WEEK) return;
  const made = WEEK.generated ? DESK.ago(WEEK.generated) : "";
  s.textContent = made ? `Updated ${made}` : "Pick Desk";
}
