<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YourNFL Pick Desk</title>
<meta name="description" content="NFL game predictions blended with the betting market, each team's form, and the model's own measured record.">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)">
<!-- iOS ignores the manifest: Add to Home Screen reads these instead. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YourNFL">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* desk.css:begin - copied from shared/desk.css by scripts/sync_desk.py; edit that file */
/* The Desk design system: one stylesheet for YourMMA, YourNFL and
   YourSoccer. This file is the source. scripts/sync_desk.py copies it into
   every app's index.html, and a test fails if any copy drifts - so the apps
   look like one family because they are drawing from one sheet, not because
   copies were kept in step by hand.

   Red is the red corner and the home side; blue the blue corner and the away
   side, as the sports themselves colour them. Teal and orange carry
   good/bad: the green/red pair failed the deutan check (dE 4.3), these
   clear it (11.6). Coloured TEXT uses the *-ink tokens, which keep 4.5:1 on
   every surface they sit on; the base tokens are for fills and tints. */
:root{
  --ground:#f3f4f7; --surface:#ffffff; --raised:#ffffff; --sunk:#eceef2;
  --line:#dfe2e8; --line-soft:#e9ebf0; --line-strong:#8a95ab;
  --ink:#11131a; --ink-2:#4a505f; --ink-3:#656b7c;
  --accent:#e23d43; --red:#e23d43; --blue:#2f72de;
  --gain:#14998a; --loss:#d45a2c; --gold:#a8730e;
  --gain-ink:#0f7065; --loss-ink:#a54622; --gold-ink:#845a0b; --red-ink:#c11d23; --blue-ink:#2563c7;
  --win:#0e7a6d; --lose:#c2501f; --even:#6b6f7d;
  --chip:#eef0f4; --chip-edge:rgba(0,0,0,.10);
  --seg-on:#ffffff; --accent-fill:#d4393f;
  --shadow:0 1px 2px rgba(17,19,26,.05),0 6px 20px rgba(17,19,26,.06);
  --shadow-lg:0 -8px 40px rgba(17,19,26,.18);
  --radius:16px; --radius-sm:11px;
  --bar-h:52px;
  --appbar-h:60px;   /* the row inside the app bar; the bar adds a 1px border */
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0b0c10; --surface:#14161d; --raised:#1a1d26; --sunk:#101218;
  --line:#272b36; --line-soft:#1e212b; --line-strong:#5e6882;
  --ink:#f1f3f8; --ink-2:#a8aebd; --ink-3:#878ea0;
  --accent:#ef4d52; --red:#ef4d52; --blue:#4f8ff7;
  --gain:#2ec4a6; --loss:#f07a4c; --gold:#e1a93c;
  --gain-ink:#2ec4a6; --loss-ink:#f07a4c; --gold-ink:#e1a93c; --red-ink:#f35b60; --blue-ink:#4f8ff7;
  --win:#12806f; --lose:#f07a4c;
  --chip:#1d2029; --chip-edge:rgba(255,255,255,.22);
  --seg-on:#2b2f3b; --accent-fill:#ce4247;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 -10px 44px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0b0c10; --surface:#14161d; --raised:#1a1d26; --sunk:#101218;
  --line:#272b36; --line-soft:#1e212b; --line-strong:#5e6882;
  --ink:#f1f3f8; --ink-2:#a8aebd; --ink-3:#878ea0;
  --accent:#ef4d52; --red:#ef4d52; --blue:#4f8ff7;
  --gain:#2ec4a6; --loss:#f07a4c; --gold:#e1a93c;
  --gain-ink:#2ec4a6; --loss-ink:#f07a4c; --gold-ink:#e1a93c; --red-ink:#f35b60; --blue-ink:#4f8ff7;
  --win:#12806f; --lose:#f07a4c;
  --chip:#1d2029; --chip-edge:rgba(255,255,255,.22);
  --seg-on:#2b2f3b; --accent-fill:#ce4247;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 -10px 44px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
/* Must beat any component's display: a class selector outranks the
   user-agent [hidden] rule. */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{min-height:100%}
/* A bottom sheet holds the page still behind it. */
html:has(.sheet-back){overflow:hidden}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font:400 15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.08}
h1{font-size:30px} h2{font-size:21px} h3{font-size:17px}
a{color:var(--blue-ink);text-underline-offset:2px}
button{font:inherit;color:inherit}
code{font:500 .92em "IBM Plex Mono",ui-monospace,monospace}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.mini{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.lede{color:var(--ink-2);font-size:14.5px;max-width:62ch;margin:0}
.eyebrow{font:600 11px/1.2 "IBM Plex Sans",sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* ---------------------------------------------------------------- shell */
.appbar{
  position:sticky;top:0;z-index:20;
  padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--ground) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.appbar-in{max-width:760px;margin:0 auto;padding:0 10px 0 16px;
  display:flex;align-items:center;gap:10px;height:var(--appbar-h)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;min-width:0}
.brand .logo{width:32px;height:32px;border-radius:9px;flex:none;box-shadow:0 0 0 1px var(--line)}
.brand-name{font:700 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.03em;
  text-transform:uppercase;white-space:nowrap}
.brand-name span{color:var(--accent)}
.brand>span{min-width:0;overflow:hidden}
.brand-sub{display:block;font:500 11px/1.2 "IBM Plex Sans",sans-serif;color:var(--ink-3);
  letter-spacing:0;text-transform:none;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .spacer{flex:1}
/* The sport switch: the apps are one family. The current one is a label,
   the others links - each with a 44px hit area around a 36px pill. */
.switch{display:flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px;flex:none}
.switch a,.switch span{display:inline-flex;align-items:center;justify-content:center;min-height:36px;
  font:700 12px/1 "IBM Plex Sans",sans-serif;letter-spacing:.06em;
  padding:0 12px;border-radius:999px;text-decoration:none;color:var(--ink-3);min-width:44px;text-align:center}
.switch a{position:relative}
.switch a::after{content:"";position:absolute;inset:-4px -2px}
.switch span[aria-current]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
/* Three sports do not fit beside the app's subtitle on a small phone. */
@media (max-width:380px){
  .switch:has(>:nth-child(3)) a,.switch:has(>:nth-child(3)) span{padding:0 8px;min-width:40px;letter-spacing:.03em}
  .appbar:has(.switch>:nth-child(3)) .brand-sub{display:none}
}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--ink-2);cursor:pointer}
.iconbtn:active{background:var(--chip)}
.iconbtn svg{width:22px;height:22px}

.wrap{max-width:760px;margin:0 auto;
  padding:14px 14px calc(var(--bar-h) + 28px + env(safe-area-inset-bottom,0px))}
section.view{display:flex;flex-direction:column;gap:14px}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--line-soft);
  padding:4px max(8px,env(safe-area-inset-left,0px)) max(4px,env(safe-area-inset-bottom,0px));
}
.tabbar-in{max-width:520px;margin:0 auto;display:flex;gap:4px}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  min-height:var(--bar-h);justify-content:center;
  background:none;border:0;border-radius:14px;padding:3px 2px;cursor:pointer;
  color:var(--ink-3);font:600 10.5px/1.1 "IBM Plex Sans",sans-serif;letter-spacing:.04em;
}
.tabbar button svg{width:24px;height:24px;transition:transform .18s ease}
.tabbar button .pill{display:flex;align-items:center;justify-content:center;
  width:56px;height:30px;border-radius:999px;transition:background .18s ease}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] .pill{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

/* ------------------------------------------------------------- headers */
.hero{display:flex;flex-direction:column;gap:6px;padding:4px 2px 2px}
.hero h1{font-size:31px}
/* One quiet line of facts under a title - not a row of pills, which is
   what a pick's tags look like. */
.hero .facts{font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.hero .facts .warn{color:var(--gold-ink);font-weight:600}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:6px 2px -4px}
.section-head h2{font-size:19px}
/* A day or card section that stays in view while its games scroll past,
   pinned exactly under the app bar. */
.sticky-head{position:sticky;top:calc(var(--appbar-h) + 1px + env(safe-area-inset-top,0px));z-index:5;
  margin:4px -14px 0;padding:8px 16px 6px;color:var(--ink-2);
  background:color-mix(in srgb,var(--ground) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* ---------------------------------------------------------- chips, tags */
.chip,.tag{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  font:600 11.5px/1 "IBM Plex Sans",sans-serif;letter-spacing:.02em;
  padding:6px 9px;border-radius:999px;background:var(--chip);color:var(--ink-2);border:0}
.chip.num,.tag.num{font-family:"IBM Plex Mono",monospace;font-weight:500;letter-spacing:0}
.tag.good,.chip.good{background:color-mix(in srgb,var(--gain) 15%,transparent);color:var(--gain-ink)}
.tag.warn,.chip.warn{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold-ink)}
.tag.bad,.chip.bad{background:color-mix(in srgb,var(--loss) 15%,transparent);color:var(--loss-ink)}
.tag.flat,.chip.flat{color:var(--ink-2)}
.tag.accent,.chip.accent{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--red-ink)}
button.chip{min-height:44px;padding:0 14px;font-size:13px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips:has(>button.chip){gap:8px}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px;
  -webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}

/* Segmented control: a filter with at most a handful of choices. */
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:44px;padding:0 6px;cursor:pointer;
  font:600 12.5px/1 "IBM Plex Sans",sans-serif;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.16)}

/* A tap shows a press. iOS applies :active only when a touchstart listener
   exists; desk.js adds one. */
details.match>summary:active,details.fold>summary:active,details.cardfold>summary:active{
  background:color-mix(in srgb,var(--ink) 5%,transparent)}
.tabbar button:active .pill,.seg button:active,.switch a:active,button.chip:active,.sheet .row:active,.detail-close:active{
  background:color-mix(in srgb,var(--ink) 9%,transparent)}

/* ---------------------------------------------------------------- cards */
.card{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:11px}
.card h2{font-size:20px}
.note{background:var(--sunk);border:1px solid var(--line-soft);border-radius:var(--radius-sm);
  padding:12px 14px;font-size:13px;color:var(--ink-2);line-height:1.55}
.note b{color:var(--ink);font-weight:600}
.warnbox{border-left:3px solid var(--gold)}
.err{border-left:3px solid var(--loss)}
/* An explainer folded to its first lines: the numbers come first, the
   caveat is one tap away and never gone. */
details.fold{background:var(--sunk);border:1px solid var(--line-soft);border-radius:var(--radius-sm)}
details.fold>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;
  font-size:13px;color:var(--ink-2);line-height:1.5;min-height:44px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .ic{flex:none;color:var(--gold-ink);margin-top:1px}
details.fold>summary .ic svg{width:18px;height:18px}
details.fold>summary .clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details.fold[open]>summary .clip{display:block;-webkit-line-clamp:unset}
details.fold>summary .more{margin-left:auto;flex:none;color:var(--blue-ink);font-weight:600;font-size:12.5px}
details.fold[open]>summary .more{display:none}
details.fold .fold-body{padding:0 14px 13px 42px;display:flex;flex-direction:column;gap:9px;
  font-size:13px;color:var(--ink-2);line-height:1.55}
/* A secondary section of an opened match, folded to its title. */
details.fold.sub{background:var(--surface)}
details.fold.sub>summary{align-items:center}
details.fold.sub>summary b{color:var(--ink);font-weight:600}
details.fold.sub .fold-body{padding:0 12px 12px}
/* A record card folded to its title and what it found. A details inside a
   .card, never a flex details: Safari has ignored flex on details. */
details.cardfold>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;
  min-height:44px;justify-content:center}
details.cardfold>summary::-webkit-details-marker{display:none}
details.cardfold .cf-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
details.cardfold .cf-head svg{flex:none;width:20px;height:20px;color:var(--ink-3);transition:transform .2s ease}
details.cardfold[open] .cf-head svg{transform:rotate(180deg)}
details.cardfold .take{font-size:14px;line-height:1.45;color:var(--ink-2)}
.cardfold-body{display:flex;flex-direction:column;gap:11px;margin-top:11px}
/* A legend: the real element on the left, what it means on the right. */
.gloss{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;margin:0;font-size:13.5px;align-items:baseline}
.gloss dt{justify-self:start} .gloss dd{margin:0;color:var(--ink-2)}

/* ------------------------------------------------------- the match card */
/* One fight or one game: two sides, a probability bar, the pick. Tapping
   it opens the detail. */
.matches{display:flex;flex-direction:column;gap:10px}
details.match{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
  scroll-margin-top:calc(var(--appbar-h) + 1px + env(safe-area-inset-top,0px) + 8px)}
/* 28px: the sticky day head a match sits under. */
.day details.match{scroll-margin-top:calc(var(--appbar-h) + 1px + 28px + env(safe-area-inset-top,0px) + 8px)}
details.match[open]{border-color:var(--line)}
details.match>summary{list-style:none;cursor:pointer;padding:12px 14px 13px;display:flex;flex-direction:column;gap:9px}
details.match>summary::-webkit-details-marker{display:none}
details.match>summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;border-radius:var(--radius)}
.match-top{display:flex;align-items:center;gap:6px;min-height:22px}
.match-top .when{font-size:12.5px;color:var(--ink-2);font-weight:500}
details.match .chev{margin-left:auto;color:var(--ink-3);display:flex;transition:transform .2s ease}
details.match .chev svg{width:20px;height:20px}
details.match[open]>summary .chev{transform:rotate(180deg)}
.badge{font:700 10.5px/1 "IBM Plex Sans",sans-serif;letter-spacing:.09em;text-transform:uppercase;
  padding:4px 7px;border-radius:6px;background:var(--chip);color:var(--ink-2)}
/* Neutral: red is the red corner and the home side, not "important". */
.badge.accent{background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink)}
.badge.gold{background:color-mix(in srgb,var(--gold) 17%,transparent);color:var(--gold-ink)}
.badge.live{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss-ink)}

.sides{display:flex;flex-direction:column;gap:7px}
/* A side: the corner's colour, the name over its record and last five, and
   on the right the side's own chance. */
.side{display:grid;grid-template-columns:4px minmax(0,1fr) auto;column-gap:11px;align-items:center}
.side .mark{grid-row:1 / span 2;align-self:stretch;border-radius:4px;background:var(--line)}
.side.r .mark{background:var(--red)} .side.b .mark{background:var(--blue)}
.side .who{grid-column:2;display:flex;align-items:center;gap:7px;min-width:0}
.side .nm{font-weight:600;font-size:15.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .sub{grid-column:2;display:flex;align-items:center;gap:8px;min-width:0;margin-top:4px;flex-wrap:wrap}
.side .rec{font-size:12.5px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.side .rec.none{font-weight:400;color:var(--ink-3)}
.side .rec .src{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink-3);margin-left:3px}
.side .p{grid-row:1 / span 2;grid-column:3;text-align:right;font:600 19px/1 "IBM Plex Mono",monospace;
  color:var(--ink-3);font-variant-numeric:tabular-nums;padding-left:6px}
.side .p small{font-size:12px;font-weight:500;margin-left:1px;color:var(--ink-3)}
.side.picked .p{color:var(--ink)}
/* With a pick made, the other side steps back so the pick reads first. */
.side.picked .nm{font-weight:700}
.sides:has(.picked) .side:not(.picked):not(.lost) .nm{font-weight:500;color:var(--ink-2)}
.side.picked .p{font-size:22px}
.sides:has(.picked) .side:not(.picked) .p{font-size:16px}
.side .score{grid-row:1 / span 2;grid-column:3;font:600 22px/1 "IBM Plex Mono",monospace;padding-left:6px}
.side.lost .nm,.side.lost .score{color:var(--ink-3)}
/* Team badge: the club's colour behind its code, with an edge so a navy or
   black badge does not vanish into a dark card. */
.teamchip{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:24px;
  padding:0 5px;border-radius:7px;font:700 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;
  color:#fff;background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--chip-edge)}
.side .at{font:700 10.5px/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

.probbar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.probbar i{display:block;min-width:2px}
.probbar .r{background:var(--red)} .probbar .b{background:var(--blue)} .probbar .d{background:var(--even)}
.probbar.none i{background:var(--line)}
.probbar.has-pick i:not(.pk){opacity:.35}

.pickline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pickline .pick{display:inline-flex;align-items:center;gap:6px;font:700 12.5px/1 "IBM Plex Sans",sans-serif;
  padding:6px 10px 6px 8px;border-radius:999px;background:var(--ink);color:var(--surface)}
.pickline .pick svg{width:14px;height:14px}
.pickline .pick .odds{font:500 12px/1 "IBM Plex Mono",monospace;opacity:.72;margin-left:2px}
/* What the pick says beyond who: one quiet line of facts, not more pills. */
.factline{font:500 12px/1.35 "IBM Plex Mono",monospace;color:var(--ink-3);margin-top:-3px}
.factline .warn{color:var(--loss-ink);font-weight:600}

/* Last results, newest first: a win a filled teal circle, a loss an orange
   ring - they differ by shape as well as hue. */
.last5{display:inline-flex;gap:3px;flex:none}
.res{display:inline-flex;flex:none;align-items:center;justify-content:center;
  width:21px;height:21px;border-radius:50%;font:700 9.5px/1 "IBM Plex Sans",sans-serif;
  color:#fff;letter-spacing:0}
.res.w{background:var(--win)} .res.d,.res.nc,.res.t{background:var(--even)}
.res.l{background:none;color:var(--lose);box-shadow:inset 0 0 0 1.5px var(--lose)}

.alert{font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:9px;
  border-left:3px solid var(--loss);background:color-mix(in srgb,var(--loss) 10%,transparent);color:var(--ink-2)}
.alert b{color:var(--ink);font-weight:600}
.alert.doubtful{border-left-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.alert.questionable{border-left-color:var(--line);background:var(--sunk)}

/* The opened match. */
.detail{border-top:1px solid var(--line-soft);padding:14px;
  display:flex;flex-direction:column;gap:12px;background:var(--sunk)}
.detail-close{align-self:center;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;
  border:0;border-radius:999px;background:var(--chip);color:var(--ink-2);font:600 13px/1 "IBM Plex Sans",sans-serif;cursor:pointer}
.detail-close svg{width:16px;height:16px;transform:rotate(180deg)}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-sm);
  padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.panel>.eyebrow:first-child{margin-bottom:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.two{grid-template-columns:1fr}}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3>div{background:var(--sunk);border-radius:10px;padding:9px 10px}
.stat3 .k{font:600 10.5px/1.2 "IBM Plex Sans",sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.stat3 .v{font:600 17px/1.1 "IBM Plex Mono",monospace;margin-top:4px}
ul.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
ul.list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
ul.list li:last-child{border-bottom:0}
ul.list li .end{margin-left:auto;flex:none;text-align:right}
ul.list .rk{min-width:22px;color:var(--ink-3);font-size:12px;padding-top:1px}
ul.list .lead{min-width:40px;font-weight:600;color:var(--ink)}
.st{font:700 10.5px/1 "IBM Plex Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-left:5px;white-space:nowrap}
.st.out{color:var(--loss-ink)} .st.doubtful{color:var(--gold-ink)} .st.questionable{color:var(--ink-3)} .st.scored{color:var(--gain-ink)}
.news a{color:var(--ink);text-decoration:none;font-weight:500}
.news a::after{content:" ↗";color:var(--blue-ink)}

/* Bars split into labelled parts (KO / SUB / DEC). */
.method{display:flex;gap:2px;height:28px;border-radius:8px;overflow:hidden;background:var(--line-soft)}
.method i{display:flex;align-items:center;justify-content:center;
  font:600 10.5px/1 "IBM Plex Mono",monospace;color:#fff;min-width:0;font-style:normal}
.method .ko{background:#8c4b8f} .method .sb{background:#367399} .method .dc{background:#6b7280}
.method .dr{background:var(--line)}
.rounds{display:flex;align-items:flex-end;gap:6px;height:48px}
.rounds div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.rounds b{display:block;width:100%;background:var(--blue);border-radius:4px 4px 0 0;opacity:.8}
.rounds span{font:500 11px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}

/* Ranked lists of picks (most doubtful first, and the like). */
ul.rank{list-style:none;padding:0;margin:0}
ul.rank li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
ul.rank li:last-child{border-bottom:0}
ul.rank li b{color:var(--ink);font-weight:600}
ul.rank li .num{margin-left:auto;font-weight:600;font-size:15px}
ul.rank .num.warn{color:var(--loss-ink)} ul.rank .num.good{color:var(--gain-ink)} ul.rank .num.flat{color:var(--ink-3)}
.meter{flex:none;width:52px;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--loss);border-radius:9px}
.meter.good i{background:var(--gain)} .meter.flat i{background:var(--ink-3)}

/* ------------------------------------------------------------ compare */
.pickers{display:grid;grid-template-columns:1fr;gap:10px}
.pickers.pair{grid-template-columns:1fr 1fr}
.field{display:flex;flex-direction:column;gap:6px;position:relative}
.field label{font:600 10.5px/1 "IBM Plex Sans",sans-serif;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3)}
.field input,.field select{width:100%;min-height:46px;padding:11px 13px;border-radius:12px;font-size:16px;
  background:var(--raised);color:var(--ink);border:1px solid var(--line-strong);font-family:inherit;-webkit-appearance:none;appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.field input:focus,.field select:focus{outline:2px solid var(--blue);outline-offset:-1px}
.field.r input,.field.r select{box-shadow:inset 3px 0 0 var(--red)}
.field.b input,.field.b select{box-shadow:inset 3px 0 0 var(--blue)}
/* Suggestions under a search box: real buttons, because a phone's datalist
   is unreliable (iOS shows it in a strip, if at all). */
.suggest{display:flex;flex-direction:column;background:var(--raised);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.suggest button{border:0;background:none;text-align:left;padding:12px 13px;font-size:15px;cursor:pointer;
  border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:8px}
.suggest button:last-child{border-bottom:0}
.suggest button:active{background:var(--chip)}
.suggest button:focus-visible{outline-offset:-2px}
.suggest .mini{white-space:nowrap}
/* A search box scrolls to the top when it takes the keyboard, so its
   suggestions are not under the keyboard. (Hiding the title instead moved
   the page as a suggestion was tapped, and the tap missed.) */
.pickers .field{scroll-margin-top:calc(var(--appbar-h) + 1px + env(safe-area-inset-top,0px) + 10px)}
.tape-head{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 4px}
.tape-head .l{text-align:right}
.tape{display:grid;grid-template-columns:1fr auto 1fr;gap:9px 10px;align-items:center;font-size:14px}
.tape .lab{text-align:center;font:600 10.5px/1.25 "IBM Plex Sans",sans-serif;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);max-width:110px}
.tape .l{text-align:right;justify-self:end} .tape .r2{text-align:left;justify-self:start}
.tape .win{font-weight:700;color:var(--ink);padding:2px 7px;border-radius:7px}
.tape .win.r{background:color-mix(in srgb,var(--red) 15%,transparent)}
.tape .win.b{background:color-mix(in srgb,var(--blue) 15%,transparent)}
.tape .head{font:700 16px/1.15 "Barlow Condensed",sans-serif;letter-spacing:.02em}
.tape .head.l{color:var(--red-ink)} .tape .head.r2{color:var(--blue-ink)}
.adv{display:flex;flex-direction:column;gap:10px}
.adv-row{display:grid;grid-template-columns:78px 1fr 86px;gap:8px;align-items:center}
.advval{font:500 11px/1.25 "IBM Plex Mono",monospace;color:var(--ink-2);text-align:right}
.advval small{display:block;font:500 10.5px/1.2 "IBM Plex Sans",sans-serif;color:var(--ink-3);white-space:nowrap}
.adv-row .lab{font:600 11px/1.2 "IBM Plex Sans",sans-serif;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3)}
.gauge{position:relative;height:22px;background:var(--sunk);border-radius:6px}
.gauge .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.gauge i{position:absolute;top:4px;bottom:4px;border-radius:3px}

/* -------------------------------------------------------- record, charts */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius-sm);padding:13px 13px 12px;box-shadow:var(--shadow)}
.tile .k{font:600 11px/1.2 "IBM Plex Sans",sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:26px;font-weight:600;margin-top:7px;line-height:1}
.tile .s{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.35}
.tile.hero-tile{grid-column:1 / -1;display:flex;align-items:center;gap:16px}
.tile.hero-tile .v{font-size:38px;margin-top:4px}
.tile.wide{grid-column:1 / -1}
.ring{flex:none;width:76px;height:76px}
.v.gain{color:var(--gain-ink)} .v.loss{color:var(--loss-ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:600 11px/1.2 "IBM Plex Sans",sans-serif;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3)}
td.n,th.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.n{white-space:normal;vertical-align:bottom}
td.n .mini{display:block;margin-top:2px;font-size:11px}
td.gain{color:var(--gain-ink)} td.loss{color:var(--loss-ink)}
/* A row's description on its own full-width row under it. */
tr.has-sub td{border-bottom:0;padding-bottom:2px}
tr.sub td{padding-top:0;font-size:12.5px;color:var(--ink-3)}
tr.grp td{font:600 11px/1.2 "IBM Plex Sans",sans-serif;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);padding-top:14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
svg{display:block;max-width:100%;height:auto}
/* Chart text: px inside an SVG are user units, so this scales with the
   viewBox and beats the presentation attributes. */
.card svg[role="img"] text{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:22px;fill:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;
  margin-right:5px;vertical-align:-1px}
ul.plain{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2);line-height:1.6}
ul.plain li{margin-bottom:6px}
ul.plain li b{color:var(--ink)}
.mvp{margin-top:4px;color:var(--ink-2);white-space:nowrap}

/* ------------------------------------------------------------ loading */
.skeleton{display:flex;flex-direction:column;gap:10px}
.skeleton i{display:block;height:118px;border-radius:var(--radius);background:var(--surface);
  border:1px solid var(--line-soft);position:relative;overflow:hidden}
.skeleton i.short{height:64px}
.skeleton i::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 5%,transparent),transparent);
  transform:translateX(-100%);animation:shimmer 1.3s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.loading{color:var(--ink-3);font-size:13.5px;padding:22px 0;text-align:center}
.empty{text-align:center;padding:26px 12px;color:var(--ink-3);font-size:14px}

/* ------------------------------------------------ install, sheet, toast */
.banner{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:12px 12px 12px 14px;box-shadow:var(--shadow)}
.banner img{width:42px;height:42px;border-radius:11px;flex:none}
.banner .txt{flex:1;min-width:0}
.banner .txt b{display:block;font-size:14.5px}
.banner .txt span{font-size:12.5px;color:var(--ink-3)}
@media (max-width:430px){
  .banner{padding:6px 6px 6px 14px}
  .banner img,.banner .btn svg,.banner .txt span{display:none}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;
  padding:10px 16px;border-radius:12px;border:0;cursor:pointer;text-decoration:none;
  font:700 14px/1 "IBM Plex Sans",sans-serif;background:var(--accent-fill);color:#fff}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.small{min-height:44px;padding:8px 13px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px}
.btn:active{filter:brightness(.92)}

.sheet-back{position:fixed;inset:0;z-index:60;background:rgba(5,6,10,.5);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;
  box-shadow:var(--shadow-lg);padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:88vh;max-height:88dvh;overflow:auto;position:relative;overscroll-behavior:contain;
  animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet .sheet-x{position:absolute;top:6px;right:8px}
.sheet h2{font-size:23px;margin-bottom:4px;padding-right:44px}
.sheet .row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.sheet .row:last-child{border-bottom:0}
.sheet button.row{width:100%;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;cursor:pointer}
.sheet a.row{text-decoration:none;color:inherit}
.sheet .row .ic{width:38px;height:38px;border-radius:11px;background:var(--chip);display:flex;
  align-items:center;justify-content:center;flex:none;color:var(--ink-2)}
.sheet .row .ic svg{width:21px;height:21px}
.sheet .row .t{flex:1;min-width:0;font-size:14.5px}
.sheet .row .t small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.sheet ol.steps{margin:10px 0 4px;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.sheet ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;font-size:15px}
.sheet ol.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;
  background:var(--chip);display:flex;align-items:center;justify-content:center;font:700 13px/1 "IBM Plex Sans",sans-serif}
.sheet ol.steps>li>span{flex:1;min-width:0}
/* An icon inside a sentence, drawn the size of the words around it. */
svg.inl{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.28em;color:var(--blue-ink);margin:0 1px}
.sheet .actions{display:flex;gap:10px;margin-top:16px}
.sheet .actions .btn{flex:1}

.toast{position:fixed;left:50%;z-index:70;bottom:calc(var(--bar-h) + 26px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);max-width:calc(100% - 28px);display:flex;align-items:center;gap:12px;
  background:var(--ink);color:var(--surface);border-radius:14px;padding:11px 12px 11px 16px;
  font-size:14px;box-shadow:var(--shadow-lg);animation:toastrise .22s ease}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;text-underline-offset:3px;
  font:700 13.5px/1 "IBM Plex Sans",sans-serif;padding:8px 6px;cursor:pointer;white-space:nowrap}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
@keyframes toastrise{from{transform:translate(-50%,16px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (min-width:760px){
  .wrap{padding-left:20px;padding-right:20px}
  .sticky-head{margin-left:-20px;margin-right:-20px;padding-left:22px}
}
.days{display:flex;flex-direction:column;gap:12px}
.day .matches{margin-top:4px}
.nowrap{white-space:nowrap}
/* desk.css:end */
</style>
</head>

  let deferred = null;
  const ua = navigator.userAgent || "";
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);
  const inAppBrowser = /FBAN|FBAV|Instagram|Line\/|Snapchat|Twitter|TikTok|GSA\/|; wv\)|WhatsApp|Telegram|Discord/i.test(ua);
  const standalone = () =>
    window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const served = () => location.protocol.startsWith("http");
  const canOfferInstall = () => served() && !standalone();

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferred = e;
    refreshInstallUI();
  });
  window.addEventListener("appinstalled", () => {
    deferred = null;
    refreshInstallUI();
    toast(`${cfg ? cfg.name : "The app"} is installed. Open it from your home screen.`);
  });

  async function install() {
    if (deferred) {
      const e = deferred;
      deferred = null;
      e.prompt();
      try { await e.userChoice; } catch (err) { /* dismissed */ }
      refreshInstallUI();
      return;
    }
    installHelp();
  }

  function copyLink() {
    const url = location.href.split("#")[0];
    const done = () => toast("Link copied. Paste it into Safari or Chrome.");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => toast(url, null, null, 9000));
    else toast(url, null, null, 9000);
  }

  function installHelp() {
    const name = esc(cfg.name);
    let body;
    if (inAppBrowser) {
      body = `<h2>Open it in your browser</h2>
        <p class="mini">This page is open inside another app, which cannot install apps.
          Open it in ${isIOS ? "Safari" : "Chrome"}, then install from there.</p>
        <ol class="steps">
          <li><span>Tap the ${icon("more", 'class="inl"')} or ${icon("share", 'class="inl"')} menu of this screen</span></li>
          <li><span>Choose <b>Open in ${isIOS ? "Safari" : "browser"}</b></span></li>
          <li><span>Tap <b>Install</b> in ${name}'s menu</span></li>
        </ol>
        <div class="actions"><button class="btn ghost" type="button" data-copy>${icon("copy")} Copy link</button>
          <button class="btn" type="button" data-close>Done</button></div>`;
    } else if (isIOS) {
      body = `<h2>Install ${name}</h2>
        <p class="mini">It opens full screen from your home screen and works with no signal.</p>
        <ol class="steps">
          <li><span>Tap ${icon("share", 'class="inl"')} <b>Share</b> in Safari's toolbar</span></li>
          <li><span>Scroll down and tap ${icon("plus", 'class="inl"')} <b>Add to Home Screen</b></span></li>
          <li><span>Tap <b>Add</b></span></li>
        </ol>
        <p class="mini">Opened from another app's link? Tap ${icon("globe", 'class="inl"')} to open the page in
          Safari first - only Safari itself can add it. In Chrome on iPhone the Share button is in the
          address bar. Already installed? Open ${name} from your home screen.</p>
        <div class="actions"><button class="btn" type="button" data-close>Got it</button></div>`;
    } else {
      body = `<h2>Install ${name}</h2>
        <p class="mini">It opens full screen from your home screen and works with no signal.</p>
        <ol class="steps">
          <li><span>Open the browser menu ${icon("more", 'class="inl" style="transform:rotate(90deg)"')}</span></li>
          <li><span>Tap <b>Install app</b> or <b>Add to Home screen</b></span></li>
          <li><span>Tap <b>Install</b></span></li>
        </ol>
        <p class="mini">${isAndroid ? "Use Chrome, Edge or Samsung Internet." : "In Chrome or Edge on a computer, the install button is in the address bar."}
          If the menu has no install option, the app may already be installed.</p>
        <div class="actions"><button class="btn" type="button" data-close>Got it</button></div>`;
    }
    const s = sheet(body);
    const c = s.querySelector("[data-copy]");
    if (c) c.addEventListener("click", copyLink);
  }

  // The banner a tab can show above its content, from the second visit
  // (the menu offers install from the first), until installed or waved off.
  function banner() {
    if (!canOfferInstall() || store.get(`${cfg.key}.install-dismissed`)
        || (+store.get(`${cfg.key}.visits`) || 0) < 2) return "";
    return `<div class="banner" data-install-banner>
      <img src="${esc(cfg.icon)}" alt="">
      <div class="txt"><b>Install ${esc(cfg.name)}</b><span>Full screen, works offline</span></div>
      <button class="btn small" type="button" data-install>${icon("download")} Install</button>
      <button class="iconbtn" type="button" data-dismiss aria-label="Not now">${icon("close")}</button>
    </div>`;
  }
  function refreshInstallUI() {
    document.querySelectorAll("[data-install-banner]").forEach((b) => {
      if (!canOfferInstall()) b.remove();
    });
  }
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-install]")) { e.preventDefault(); install(); }
    const d = e.target.closest("[data-dismiss]");
    if (d) {
      store.set(`${cfg.key}.install-dismissed`, "1");
      const b = d.closest("[data-install-banner]");
      if (b) b.remove();
      toast("You can install it any time from the menu.");
    }
  });

  /* ------------------------------------------------------------- menu */
  function menu() {
    const t = theme();
    const opt = (mode, label, ic) =>
      `<button type="button" data-theme-set="${mode}" aria-pressed="${t === mode}">${icon(ic, 'style="width:16px;height:16px;display:inline;vertical-align:-3px;margin-right:5px"')}${label}</button>`;
    const rows = [];
    if (canOfferInstall()) rows.push(`<button class="row" type="button" data-install>
      <span class="ic">${icon("download")}</span><span class="t">Install ${esc(cfg.name)}<small>Home screen, full screen, offline</small></span></button>`);
    if (served()) for (const sib of cfg.siblings || (cfg.sibling ? [cfg.sibling] : [])) rows.push(`<a class="row" href="${esc(sib.href)}">
      <span class="ic">${icon("swap")}</span><span class="t">Open ${esc(sib.name)}<small>${esc(sib.blurb || "")}</small></span></a>`);
    rows.push(`<button class="row" type="button" data-reload>
      <span class="ic">${icon("refresh")}</span><span class="t">Refresh<small>${esc(cfg.stamp ? cfg.stamp() : "Fetch the latest picks")}</small></span></button>`);
    const s = sheet(`<h2>${esc(cfg.name)}</h2>
      <div class="eyebrow" style="margin:14px 0 8px">Appearance</div>
      <div class="seg" role="group" aria-label="Theme">${opt("auto", "System", "auto")}${opt("light", "Light", "sun")}${opt("dark", "Dark", "moon")}</div>
      <div style="margin-top:8px">${rows.join("")}</div>
      <p class="mini" style="margin-top:10px">For entertainment and analysis. Not betting advice.</p>`);
    s.addEventListener("click", (e) => {
      const b = e.target.closest("[data-theme-set]");
      if (b) {
        const mode = b.getAttribute("data-theme-set");
        store.set(`${cfg.key}.theme`, mode);
        applyTheme(mode);
        s.querySelectorAll("[data-theme-set]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      }
      if (e.target.closest("[data-reload]")) { closeSheet(); reload(); }
    });
  }

  function reload() {
    if (cfg.onReload) cfg.onReload();
    else location.reload();
  }

  /* --------------------------------------------------- service worker */
  // The worker is what makes the app installable and what makes it open with
  // no signal. It is skipped on file:// because a file:// page has no origin
  // to scope one to - the standalone build carries its data on the page.
  // When a new version takes over, say so and offer the reload, rather than
  // leaving the old screen up until the next launch.
  function serviceWorker() {
    if (!("serviceWorker" in navigator) || !location.protocol.startsWith("http")) return;
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (hadController) toast("A new version is ready.", "Reload", () => location.reload(), 0);
    });
    const go = () => navigator.serviceWorker.register("sw.js").catch(() => {
      // No worker means no offline copy. The app still works online, so this
      // is not worth a message on the page.
    });
    if (document.readyState === "complete") go();
    else window.addEventListener("load", go);
  }

  /* ------------------------------------------------------------- init */
  // cfg: { key, name, icon, siblings: [{name, href, blurb}], stamp(), onReload() }
  function init(options) {
    cfg = options;
    store.set(`${cfg.key}.visits`, String((+store.get(`${cfg.key}.visits`) || 0) + 1));
    applyTheme(theme());
    const m = document.getElementById("menu-btn");
    if (m) m.addEventListener("click", menu);
    // The sport switch links to the other apps on the same site; a saved
    // file has no neighbour to link to.
    const sw = document.getElementById("sport-switch");
    if (sw && !served()) sw.hidden = true;
    if (!served()) document.querySelectorAll("[data-served-only]").forEach((x) => { x.hidden = true; });
    serviceWorker();
  }

  // Wire a bottom tab bar: tabs are <button id="tab-NAME">, views
  // <section id="view-NAME">. boot[NAME]() runs the first time a tab opens.
  // Each tab keeps its scroll position, as a native tab bar does.
  function tabs(names, boot, storageKey, fallback) {
    const started = {}, pos = {};
    let current = null;
    for (const t of names) {
      const v = document.getElementById(`view-${t}`);
      v.setAttribute("role", "tabpanel");
      v.setAttribute("aria-labelledby", `tab-${t}`);
    }
    function show(name, scroll) {
      if (current) pos[current] = window.scrollY;
      for (const t of names) {
        document.getElementById(`view-${t}`).hidden = t !== name;
        const tab = document.getElementById(`tab-${t}`);
        tab.setAttribute("aria-selected", String(t === name));
        tab.tabIndex = t === name ? 0 : -1;
      }
      current = name;
      store.set(storageKey, name);
      if (scroll) window.scrollTo({ top: pos[name] || 0 });
      if (!started[name]) { started[name] = true; boot[name](); }
    }
    for (const t of names) {
      document.getElementById(`tab-${t}`).addEventListener("click", () => {
        const already = document.getElementById(`tab-${t}`).getAttribute("aria-selected") === "true";
        // Tapping the open tab again goes back to its top, as native apps do.
        if (already) { pos[t] = 0; window.scrollTo({ top: 0, behavior: calm() ? "auto" : "smooth" }); }
        else show(t, true);
      });
    }
    const list = document.querySelector('[role="tablist"]');
    if (list) list.addEventListener("keydown", (e) => {
      const i = names.findIndex((t) => document.getElementById(`tab-${t}`) === document.activeElement);
      if (i < 0) return;
      const n = names.length;
      const j = { ArrowRight: (i + 1) % n, ArrowLeft: (i + n - 1) % n, Home: 0, End: n - 1 }[e.key];
      if (j == null) return;
      e.preventDefault();
      document.getElementById(`tab-${names[j]}`).focus();
      show(names[j], true);
    });
    // A home-screen shortcut opens a tab directly (manifest "shortcuts").
    let first = new URLSearchParams(location.search).get("tab") || store.get(storageKey);
    if (!names.includes(first)) first = fallback;
    show(first, false);
    return { show, restart(name) { started[name] = false; } };
  }

  const skeleton = (n = 4) =>
    `<div class="skeleton" aria-label="Loading"><i class="short"></i>${"<i></i>".repeat(n)}</div>`;

  return { icon, esc, ago, sheet, closeSheet, toast, install, banner, init, tabs, skeleton, store,
    share, closer, sub, cardFold, calm };
})();

const $ = (id) => document.getElementById(id);
const pct = (x, d = 0) => (x == null ? "—" : `${(x * 100).toFixed(d)}%`);
// Rounded before the sign is taken: -0.004 is "0.00", not "−0.00".
const signed = (x, d = 1) => {
  if (x == null) return "—";
  const r = Number(Number(x).toFixed(d));
  return r === 0 ? (0).toFixed(d) : `${r > 0 ? "+" : "−"}${Math.abs(r).toFixed(d)}`;
};
const num = (x, d = 2) => (x == null ? "—" : Number(x).toFixed(d));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// American odds as a bookmaker prints them.
const odds = (o) => (o == null ? "—" : o > 0 ? `+${Math.round(o)}` : o < 0 ? `−${Math.abs(Math.round(o))}` : "0");
// A spread from one side's point of view: "KC −7.5", "BUF +3", "PK".
const line = (team, pts) =>
  pts == null ? "—" : pts === 0 ? `${team} PK` : `${team} ${pts > 0 ? "+" : "−"}${Math.abs(pts)}`;
const icon = DESK.icon;
const shortDate = (d) => {
  const t = new Date(`${d}T12:00:00Z`);
  return Number.isNaN(t.getTime()) ? (d || "") : t.toLocaleDateString(undefined, { day: "numeric", month: "short", timeZone: "UTC" });
};

// Each club's colours, for the badge behind its code: [background, text].
const TEAM_COLOURS = {
  ARI: ["#97233F", "#fff"], ATL: ["#A71930", "#fff"], BAL: ["#241773", "#fff"], BUF: ["#00338D", "#fff"],
  CAR: ["#0085CA", "#000"], CHI: ["#0B162A", "#F26522"], CIN: ["#FB4F14", "#000"], CLE: ["#311D00", "#FF3C00"],
  DAL: ["#003594", "#fff"], DEN: ["#FB4F14", "#002244"], DET: ["#0076B6", "#fff"], GB: ["#203731", "#FFB612"],
  HOU: ["#03202F", "#fff"], IND: ["#002C5F", "#fff"], JAX: ["#006778", "#fff"], KC: ["#E31837", "#fff"],
  LA: ["#003594", "#FFD100"], LAC: ["#0072B0", "#fff"], LV: ["#000000", "#A5ACAF"], MIA: ["#007780", "#fff"],
  MIN: ["#4F2683", "#FFC62F"], NE: ["#002244", "#fff"], NO: ["#D3BC8D", "#101820"], NYG: ["#0B2265", "#fff"],
  NYJ: ["#125740", "#fff"], PHI: ["#004C54", "#fff"], PIT: ["#FFB612", "#101820"], SEA: ["#002244", "#69BE28"],
  SF: ["#AA0000", "#fff"], TB: ["#D50A0A", "#fff"], TEN: ["#0C2340", "#4B92DB"], WAS: ["#5A1414", "#FFB612"],
};
const teamChip = (code) => {
  const [bg, fg] = TEAM_COLOURS[code] || ["var(--ink-3)", "#fff"];
  return `<span class="teamchip" style="background:${bg};color:${fg}">${esc(code)}</span>`;
};

async function load(name) {
  const embedded = window.__YOURNFL_DATA__;
  if (embedded && embedded[name]) return embedded[name];
  const res = await fetch(`data/${name}.json`, { cache: "no-cache" });
  if (!res.ok) throw new Error(`${name}.json — ${res.status}`);
  return res.json();
}

// A caveat folded to its first two lines, the rest one tap away.
const fold = (text, extra = "") => !text ? "" : `<details class="fold">
    <summary><span class="ic">${icon("info")}</span><span class="clip">${esc(text)}</span><span class="more">More</span></summary>
    ${extra ? `<div class="fold-body">${extra}</div>` : ""}</details>`;

// A failed load says so in words and offers to try again; the developer's
// hint is one tap away.
function fail(el, error, what, retry) {
  el.innerHTML = `<div class="note err"><b>Could not load ${esc(what)}.</b> Check the connection and try again.${
    retry ? `<div style="margin-top:10px"><button class="btn small ghost" type="button" data-retry>${icon("refresh")} Try again</button></div>` : ""}</div>
    ${fold(`${error.message}. The runner writes these files; to build them locally, run python nfl/engine/nfl_predict.py.`)}`;
  const b = el.querySelector("[data-retry]");
  if (b) b.addEventListener("click", () => retry());
}

// ---------------------------------------------------------------- form

// A team's record and last five games beside its name, newest on the left:
// a filled teal circle a win, an orange ring a loss, grey a tie, and the number inside is the
// margin. This season's regular-season record; the last five reach back into
// last season when this one is young. Not a model input.
const RESULT_WORD = { W: "Win", L: "Loss", T: "Tie" };
const RESULT_CLASS = { W: "w", L: "l", T: "t" };
const FORM_LEGEND = `Under each team: this season's record, then its last five games,
  newest first - a filled teal circle a win, an orange ring a loss, grey a tie. The number is the
  margin: a teal 7 is a seven-point win. Open a game for opponents and scores.`;
// What a screen reader hears instead of the dots: "won by 7, lost by 3".
const saidFive = (last5) => (last5 || []).length
  ? `<span class="sr">, last ${last5.length}: ${esc(last5.map((b) => b.result === "T" ? "tied" : `${b.result === "W" ? "won" : "lost"} by ${b.code}`).join(", "))}</span>` : "";

const GAME_WORD = { WC: "Wild Card", DIV: "Divisional", CON: "Conference final", SB: "Super Bowl" };
function weekName(b) {
  return b.game_type && b.game_type !== "REG" ? (GAME_WORD[b.game_type] || b.game_type) : `Week ${b.week}`;
}
function gameTip(b) {
  const where = b.neutral ? "vs" : b.home ? "vs" : "at";
  return `${RESULT_WORD[b.result] || b.result} ${b.score} ${where} ${b.opponent} · ${weekName(b)} ${b.season} · ${b.date}`;
}

function formLine(form) {
  // An absent key means the data predates records; null means no games yet.
  if (form === undefined) return "";
  if (!form || !form.record) return `<span class="rec none">no games yet</span>`;
  const r = form.record;
  const text = `${r.wins}-${r.losses}${r.ties ? `-${r.ties}` : ""}`;
  const dots = (form.last5 || []).map((b) => {
    const cls = RESULT_CLASS[b.result] || "t";
    return `<span class="res ${cls}" title="${esc(gameTip(b))}" aria-hidden="true">${esc(b.code)}</span>`;
  }).join("");
  return `<span class="rec num">${esc(text)}</span><span class="last5">${dots}</span>${saidFive(form.last5)}`;
}

function formDetail(code, form) {
  if (!form || !form.last5 || !form.last5.length) return "";
  const items = form.last5.map((b) => {
    const cls = RESULT_CLASS[b.result] || "t";
    const where = b.home || b.neutral ? "vs" : "at";
    return `<li><span class="res ${cls}" aria-hidden="true">${esc(b.code)}</span>
      <span><b>${esc(RESULT_WORD[b.result] || b.result)} ${esc(b.score)}</b> ${where} ${esc(b.opponent)}
      <span class="mini"><br>${esc(weekName(b))} ${esc(b.season)} · ${esc(b.date)}</span></span></li>`;
  }).join("");
  const po = form.playoffs ? ` · playoffs ${form.playoffs.wins}-${form.playoffs.losses}` : "";
  return `<div class="panel"><div class="eyebrow">${esc(code)} · last 5${esc(po)}</div><ul class="list">${items}</ul></div>`;
}

// ---------------------------------------------------------------- week

const TIER_TONE = { STRONG: "good", SOLID: "good", LEAN: "flat", "TOSS-UP": "flat" };
const STATUS_WORD = { final: "Final", started: "Kicked off", upcoming: "" };
// Where a game stands by the phone's own clock. The data says "upcoming"
// until the next run, hours after kickoff on a busy Sunday; past its kickoff
// a game is no longer upcoming, whatever the file says. Nothing here reads a
// result - "final" still comes only from the data.
const phase = (g, now = Date.now()) => g.status === "final" ? "final"
  : Date.parse(g.kickoff) <= now ? "started" : "upcoming";
const localStamp = (iso) => {
  const t = new Date(iso);
  return Number.isNaN(t.getTime()) ? String(iso || "") : t.toLocaleString(undefined,
    { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
};

// Kickoff is stored in UTC; the phone shows its own time zone.
const kickTime = (iso) => new Date(iso).toLocaleString(undefined,
  { weekday: "short", hour: "numeric", minute: "2-digit" });
const dayKey = (iso) => new Date(iso).toLocaleDateString(undefined,
  { weekday: "long", month: "short", day: "numeric" });

// One team: club badge, nickname over record and last five, and on the right
// its chance - or its score once the game is under way.
function teamRow(g, side) {
  const code = g[side];
  const full = g[`${side}_name`] || "";
  const name = full.split(" ").slice(-1)[0];
  const p = g.home_prob == null ? null : side === "home" ? g.home_prob : 1 - g.home_prob;
  const picked = g.pick && g.pick === code;
  const scored = g.score && g.score[side] != null;
  const lost = g.status === "final" && g.score && g.score[side] < g.score[side === "home" ? "away" : "home"];
  const right = scored
    ? `<span class="score num">${esc(g.score[side])}</span>`
    : `<span class="p">${p == null ? "—" : `${DESK.share(p, 1 - p)}<small>%</small>`}</span>`;
  const lead = side === "home" && !g.neutral ? `<span class="at">home</span>` : "";
  return `<div class="side ${side === "home" ? "r" : "b"}${picked ? " picked" : ""}${lost ? " lost" : ""}">
      <span class="mark"></span>
      <div class="who">${teamChip(code)}<span class="nm" title="${esc(full)}">${esc(name)}</span>${lead}</div>
      ${right}
      <div class="sub">${formLine(g[`${side}_form`])}</div>
    </div>`;
}

function marginText(g, m) {
  if (m == null) return "—";
  if (Math.abs(m) < 0.05) return "even";
  return m > 0 ? `${esc(g.home)} wins by ${Math.abs(m).toFixed(1)}` : `${esc(g.away)} wins by ${Math.abs(m).toFixed(1)}`;
}

function resultTag(g) {
  if (g.status !== "final" || !g.pick || !g.score) return "";
  const margin = g.score.home - g.score.away;
  if (margin === 0) return `<span class="tag flat">Tie</span>`;
  const won = (margin > 0 ? g.home : g.away) === g.pick;
  return won ? `<span class="tag good">${icon("check", 'style="width:13px;height:13px"')} Right</span>` : `<span class="tag bad">Wrong</span>`;
}

function qbText(qb) {
  if (!qb) return "—";
  const src = qb.replaced ? ` (starts for ${qb.replaced}, ruled out)`
    : qb.source === "last starter" ? " (assumed: last starter)" : qb.source === "projected" ? " (projected)" : "";
  const first = qb.starts === 0 ? " · first start" : qb.change ? " · new starter" : "";
  const hurt = qb.injury_status ? ` · <b>${esc(qb.injury_status)} on the injury report</b>` : "";
  return `<b>${esc(qb.name || qb.id)}</b>${esc(src)}<div class="mini">${signed(qb.rating, 2)}&nbsp;EPA/dropback${esc(first)}</div>${hurt}`;
}

function injuryList(code, list, total) {
  if (!list || !list.length) return `<div class="panel"><div class="eyebrow">${esc(code)} injuries</div><div class="mini">None listed out, doubtful or questionable.</div></div>`;
  const items = list.map((i) => `<li><span><b>${esc(i.name)}</b> <span class="mini">${esc(i.position)}${i.injury ? ` · ${esc(i.injury)}` : ""}</span></span>
    <span class="end st ${esc(String(i.status).toLowerCase())}">${esc(i.status)}</span></li>`).join("");
  const more = total > list.length ? `<div class="mini">+${total - list.length} more on the report</div>` : "";
  return `<div class="panel"><div class="eyebrow">${esc(code)} injuries</div><ul class="list">${items}</ul>${more}</div>`;
}

// ---------------------------------------------------------------- players

// Key players, touchdown chances and news - shown, not applied: none of it
// moves the pick except the starting quarterback.
const AVAIL_WORD = { out: "Out", doubtful: "Doubtful", questionable: "Questionable", active: "" };

// "Most valuable player" reads as the league award; this is the team's own.
function alertLine(a) {
  return `<div class="alert ${esc(a.status)}"><b>${esc(a.team)} ${esc(a.name)}</b>
    <span class="mini">${esc(a.position)} · ${esc(a.role === "most valuable player" ? "team's top player" : a.role)}</span> - ${esc(a.reason || AVAIL_WORD[a.status] || a.status)}</div>`;
}
// Numbers keep their units on the same line ("185&nbsp;rush"). Applied after
// esc, so the entity is not escaped.
const nb = (h) => h.replace(/(\d) /g, "$1&nbsp;").replace(/ yds\b/g, "&nbsp;yds");

function statusBadge(p) {
  return p.status && p.status !== "active"
    ? ` <span class="st ${esc(p.status)}">${esc(AVAIL_WORD[p.status] || p.status)}</span>` : "";
}

// Projected yards, if he plays: the middle of what his usage points to.
function projText(pr) {
  if (!pr) return "";
  const parts = [];
  if (pr.pass_yds != null) parts.push(`${Math.round(pr.pass_yds)} pass`);
  if (pr.rush_yds != null && pr.rush_yds >= 5) parts.push(`${Math.round(pr.rush_yds)} rush`);
  if (pr.rec_yds != null && pr.rec_yds >= 5) parts.push(`${Math.round(pr.rec_yds)} rec`);
  return parts.length ? `proj. ${parts.join(" · ")} yds` : "";
}

function leadersList(code, leaders) {
  if (!leaders || !Object.keys(leaders).length) return "";
  const li = ["passing", "rushing", "receiving"].filter((k) => leaders[k]).map((k) => {
    const l = leaders[k];
    const result = l.played === false ? ` <span class="st questionable">Did not play</span>`
      : l.actual != null
      ? ` <span class="st ${l.over ? "scored" : "questionable"}">${Math.round(l.actual)} (${l.over ? "over" : "under"})</span>` : "";
    return `<li><span class="num lead">${Math.round(l.yards)}</span>
      <span><b>${esc(l.name)}</b> <span class="mini">${esc(l.position)}</span>${statusBadge(l)}${result}<div class="mini">${esc(k)} yards</div></span></li>`;
  }).join("");
  return `<div class="panel"><div class="eyebrow">${esc(code)} · projected leaders</div><ul class="list">${li}</ul></div>`;
}

function keyPlayers(code, kp) {
  if (!kp) return "";
  const off = (kp.offense || []).map((p) => `<li><span class="rk num">${esc(p.rank)}</span>
    <span><b>${esc(p.name)}</b> <span class="mini">${esc(p.position)}</span>${statusBadge(p)}
    <div class="mini">${signed(p.value, 1)}&nbsp;EPA · ${nb(esc(p.line))}</div>${p.proj ? `<div class="mini">${nb(esc(projText(p.proj)))}</div>` : ""}</span></li>`).join("");
  const dfn = (kp.defense || []).map((p) => `<li><span class="rk num">D</span>
    <span><b>${esc(p.name)}</b> <span class="mini">${esc(p.position)}</span>${statusBadge(p)}
    <div class="mini">${nb(esc(p.line))}</div></span></li>`).join("");
  if (!off && !dfn) return "";
  return `<div class="panel"><div class="eyebrow">${esc(code)} · most valuable</div><ul class="list">${off}${dfn}</ul></div>`;
}

function tdList(code, list) {
  if (!list || !list.length) return "";
  const items = list.map((p) => {
    const result = p.played === false ? ` <span class="st questionable">Did not play</span>`
      : p.scored === true ? ` <span class="st scored">Scored</span>`
      : p.scored === false ? ` <span class="st questionable">No TD</span>` : "";
    const season = p.games_season ? `<div class="mini">${esc(p.tds_season)} TD in ${esc(p.games_season)} games this season</div>` : "";
    return `<li><span class="num lead">${pct(p.prob)}</span>
    <span><b>${esc(p.name)}</b> <span class="mini">${esc(p.position)}</span>${statusBadge(p)}${result}${season}</span></li>`;
  }).join("");
  return `<div class="panel"><div class="eyebrow">${esc(code)} · touchdown</div><ul class="list">${items}</ul></div>`;
}

function newsList(items) {
  if (!items || !items.length) return "";
  const li = items.map((n) => {
    const safe = /^https?:\/\//.test(n.link || "");
    const title = safe ? `<a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>` : esc(n.title);
    const who = (n.players || []).length ? ` · ${esc(n.players.join(", "))}` : "";
    return `<li><span>${title}<div class="mini">${esc(n.source)} · ${esc(DESK.ago(n.published))}${who}</div></span></li>`;
  }).join("");
  return `<div class="panel news"><div class="eyebrow">Player news · shown, not applied</div><ul class="list">${li}</ul></div>`;
}

function gameRow(g, d) {
  const p = g.home_prob;
  const bar = p == null
    ? `<div class="probbar none"><i style="flex:1"></i></div>`
    : `<div class="probbar${g.pick ? " has-pick" : ""}" role="img" aria-label="${esc(g.away)} ${pct(1 - p)}, ${esc(g.home)} ${pct(p)}"><i class="b${g.pick === g.away ? " pk" : ""}" style="flex:${1 - p}"></i><i class="r${g.pick === g.home ? " pk" : ""}" style="flex:${p}"></i></div>`;
  const ph = phase(g);
  const statusWord = STATUS_WORD[ph] || "";
  const status = statusWord
    ? `<span class="badge ${ph === "final" ? "" : "live"}">${esc(statusWord)}</span>` : "";
  const extra = [g.neutral ? "Neutral site" : "", g.div_game ? "Division" : ""].filter(Boolean)
    .map((x) => `<span class="badge">${esc(x)}</span>`).join("");

  // Chips for the band and for trouble only. News and the injury report sit
  // in the opened game: every game has both, so a chip said nothing.
  const tags = [];
  if (g.tier) tags.push(`<span class="tag ${TIER_TONE[g.tier] || "flat"}" title="Picks in this band won ${pct(g.tier_hit_rate, 1)} of 2016-2025 games">${esc(g.tier)}</span>`);
  const m = g.market || {};
  const pickOdds = g.pick === g.home ? m.home_ml : g.pick === g.away ? m.away_ml : null;
  for (const side of ["away", "home"]) {
    const qb = g[`${side}_qb`];
    if (qb && qb.injury_status) tags.push(`<span class="tag warn">${esc(g[side])} QB ${esc(qb.injury_status)}</span>`);
    if (qb && qb.replaced) tags.push(`<span class="tag warn">${esc(g[side])} backup QB</span>`);
  }
  // A top player out gets a chip only when the alert lines above do not
  // already say so.
  const shown = (g.alerts || []).slice(0, 2);
  const mvpOut = (g.alerts || []).filter((a) => a.role === "most valuable player" && a.status !== "questionable" && !shown.includes(a));
  for (const a of mvpOut) tags.push(`<span class="tag bad">${esc(a.team)} top player ${esc(AVAIL_WORD[a.status] || a.status)}</span>`);
  const injured = (g.home_injuries_total ?? (g.home_injuries || []).length)
    + (g.away_injuries_total ?? (g.away_injuries || []).length);
  tags.push(resultTag(g));

  const pickLine = g.pick
    ? `<span class="pick">${icon("check")}<span class="sr">Pick: </span>${esc(g.pick)}${
        pickOdds != null ? `<span class="odds num">${esc(odds(pickOdds))}</span>` : ""}</span>${tags.join("")}`
    : `<span class="mini">${esc(g.no_pick_reason || "No pick.")}</span>${tags.join("")}`;

  const sp = g.spread_pick, tp = g.total_pick;
  const kv = [
    ["Pick", g.pick ? `<b>${esc(g.pick)}</b> <span class="num">${pct(g.pick_prob, 1)}</span> <span class="mini">${g.market_prob == null ? "model alone - no market price" : "model and market blended"}</span>` : "—"],
    ["Band", g.tier ? `${esc(g.tier)} <span class="mini">picks in this band won ${pct(g.tier_hit_rate, 1)} of 2016-2025 games</span>` : "—"],
    ["Model alone", g.model_prob == null ? "—" : `${esc(g.away)} ${pct(1 - g.model_prob, 1)} · ${esc(g.home)} ${pct(g.model_prob, 1)}`],
    ["Market", g.market_prob == null ? "—" : `${esc(g.away)} ${pct(1 - g.market_prob, 1)} · ${esc(g.home)} ${pct(g.market_prob, 1)} <span class="mini">bookmaker's cut removed, ${esc(m.source === "the-odds-api" ? `${m.books ?? "?"} books` : "schedule line")}</span>`],
    ["Moneyline", m.home_ml == null ? "—" : `<span class="nowrap">${esc(g.away)} ${esc(odds(m.away_ml))}</span> · <span class="nowrap">${esc(g.home)} ${esc(odds(m.home_ml))}</span>`
      + (m.best_away_ml != null && m.best_home_ml != null ? ` <span class="mini">best <span class="nowrap">${esc(g.away)} ${esc(odds(m.best_away_ml))}${
        m.best_away_book ? ` (${esc(m.best_away_book)})` : ""}</span> · <span class="nowrap">${esc(g.home)} ${esc(odds(m.best_home_ml))}${
        m.best_home_book ? ` (${esc(m.best_home_book)})` : ""}</span></span>` : "")],
    ["Spread", (g.market_spread == null ? (g.model_spread == null ? "—" : `model: ${marginText(g, g.model_spread)}`)
      : `${esc(line(g.home, -g.market_spread))} <span class="mini">market</span> · model: ${marginText(g, g.model_spread)}`)
      + (m.opening_spread != null && m.opening_spread !== g.market_spread ? ` <span class="mini nowrap">first priced ${esc(line(g.home, -m.opening_spread))}</span>` : "")
      + (sp ? `<div class="mini">Model's side: ${esc(line(sp.team, sp.line))}, ${num(sp.edge, 1)}&nbsp;pts off the line</div>` : "")],
    ["Total", (g.market_total == null ? (g.model_total == null ? "—" : `model ${num(g.model_total, 1)}`)
      : `${num(g.market_total, 1)} <span class="mini">market</span> · model ${num(g.model_total, 1)}`)
      + (m.opening_total != null && m.opening_total !== g.market_total ? ` <span class="mini nowrap">first priced ${num(m.opening_total, 1)}</span>` : "")
      + (tp ? `<div class="mini">Model's side: ${esc(String(tp.side).toLowerCase())}</div>` : "")],
    ["Rest", `${esc(g.away)} ${g.away_rest == null ? "—" : Math.round(g.away_rest) + " days"} · ${esc(g.home)} ${g.home_rest == null ? "—" : Math.round(g.home_rest) + " days"}`],
    ["Elo", `${esc(g.away)} ${num(g.elo && g.elo.away, 0)} · ${esc(g.home)} ${num(g.elo && g.elo.home, 0)}`],
    ["Venue", `${esc(g.stadium || "—")}${g.roof ? ` · ${esc(g.roof)}` : ""}`],
  ];
  if (m.as_of) kv.push(["Prices", esc(localStamp(m.as_of))]);
  if (g.logged_at) kv.push(["Logged", `${esc(localStamp(g.logged_at))} <span class="mini">before kickoff</span>`]);

  const qbAlert = ["away", "home"].some((s) => g[`${s}_qb`] && g[`${s}_qb`].injury_status)
    ? `<div class="note warnbox">${esc(d.caveats.qb)}</div>` : "";

  // The pick first: who, how sure, the prices. How the number is built is
  // one tap away; the reference sections below are folded to their titles.
  const LEAD = ["Pick", "Band", "Moneyline", "Spread", "Total"];
  const rows = (l) => l.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");
  const pickPanel = `<div class="panel"><div class="eyebrow">The pick</div>
      <dl class="kv">${rows(kv.filter(([k]) => LEAD.includes(k)))}</dl>
      ${(sp || tp) && d.caveats && d.caveats.lines ? `<div class="mini">${esc(d.caveats.lines)}</div>` : ""}
      <details class="fold"><summary><span class="clip">How the number is built: model alone, market, Elo, rest, venue, when priced</span><span class="more">Show</span></summary>
        <div class="fold-body" style="padding-left:14px"><dl class="kv">${rows(kv.filter(([k]) => !LEAD.includes(k)))}</dl></div></details>
    </div>`;
  const kp = keyPlayers(g.away, g.away_players) + keyPlayers(g.home, g.home_players);
  const forms = formDetail(g.away, g.away_form) + formDetail(g.home, g.home_form);

  return `<details class="match" data-status="${esc(ph)}">
    <summary>
      <div class="match-top"><span class="when">${esc(kickTime(g.kickoff))}</span>${status}${extra}<span class="chev">${icon("chevron")}</span></div>
      <div class="sides">${teamRow(g, "away")}${teamRow(g, "home")}</div>
      ${bar}
      <div class="pickline">${pickLine}</div>
      ${(g.alerts || []).slice(0, 2).map(alertLine).join("")}
      ${(g.alerts || []).length > 2 ? `<div class="mini">+${g.alerts.length - 2} more in the detail</div>` : ""}
    </summary>
    <div class="detail">
      ${pickPanel}
      <div class="panel"><div class="eyebrow">Quarterbacks</div>
        <dl class="kv"><dt>${esc(g.away)}</dt><dd>${qbText(g.away_qb)}</dd><dt>${esc(g.home)}</dt><dd>${qbText(g.home_qb)}</dd></dl></div>
      ${qbAlert}
      ${(g.alerts || []).length > 2 ? g.alerts.slice(2).map(alertLine).join("") : ""}
      ${DESK.sub(`Injury report · ${injured ? `${injured} listed` : "none listed"} · shown, not applied`,
        `<div class="two">${injuryList(g.away, g.away_injuries, g.away_injuries_total)}${injuryList(g.home, g.home_injuries, g.home_injuries_total)}</div>`)}
      ${DESK.sub(`Player news · ${(g.news || []).length} · shown, not applied`, newsList(g.news))}
      ${DESK.sub("Most valuable players", kp && `<div class="two">${kp}</div>`)}
      ${DESK.sub("Touchdown chances", (g.away_td || g.home_td) && `<div class="two">${tdList(g.away, g.away_td)}${tdList(g.home, g.home_td)}</div>
        <div class="mini">${esc((d.caveats && d.caveats.td) || "")}</div>`)}
      ${DESK.sub("Projected yards", (g.away_leaders || g.home_leaders) && `<div class="two">${leadersList(g.away, g.away_leaders)}${leadersList(g.home, g.home_leaders)}</div>
        <div class="mini">${esc((d.caveats && d.caveats.props) || "")}</div>`)}
      ${DESK.sub("Last 5 games", forms && `<div class="two">${forms}</div>`)}
      ${DESK.closer(`${g.away} at ${g.home}`)}
    </div>
  </details>`;
}

function upsetCard(games) {
  const open = games.filter((g) => phase(g) === "upcoming" && g.pick && g.pick_prob != null)
    .sort((a, b) => a.pick_prob - b.pick_prob).slice(0, 6);
  if (!open.length) return "";
  const items = open.map((g) => {
    const opp = g.pick === g.home ? g.away : g.home;
    const wrong = 1 - g.pick_prob;
    return `<li><span><b>${esc(g.pick)}</b> <span class="mini">over ${esc(opp)}</span></span>
      <span class="num ${wrong >= 0.4 ? "warn" : "flat"}">${pct(wrong)}</span>
      <span class="meter ${wrong >= 0.4 ? "" : "flat"}" aria-hidden="true"><i style="width:${Math.round(wrong * 100)}%"></i></span></li>`;
  }).join("");
  return `<div class="card"><h2>Upset watch</h2>
    <div class="mini">Chance each pick is wrong, most doubtful first.</div>
    <ul class="rank">${items}</ul>
    ${fold("The probabilities are calibrated: picks the model gave about 60% won about 59% of 2016-2025 games.")}</div>`;
}

let WEEK = null;
// The header's second line: when the picks were made and how far the data runs.
function stamp() {
  const s = $("stamp");
  if (!s || !WEEK) return;
  const made = WEEK.generated ? DESK.ago(WEEK.generated) : "";
  s.textContent = made ? `Updated ${made}` : "Pick Desk";
}

const BOOT = {
  async week() {
    const el = $("view-week");
    el.innerHTML = DESK.skeleton(4);
    let d;
    try { d = await load("week"); } catch (e) { return fail(el, e, "the week", () => BOOT.week()); }
    WEEK = d;
    stamp();
    const games = d.games || [];
    const predicted = games.filter((g) => g.pick).length;
    const count = (s) => games.filter((g) => phase(g) === s).length;
    const finals = count("final"), live = count("started"), upcoming = count("upcoming");
    const byDay = new Map();
    for (const g of games) {
      const k = dayKey(g.kickoff);
      if (!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(g);
    }
    const days = [...byDay.entries()].map(([day, list]) =>
      `<div class="day" data-day>${`<div class="eyebrow sticky-head">${esc(day)}</div>`}
        <div class="matches">${list.map((g) => gameRow(g, d)).join("")}</div></div>`).join("");
    // A filter only when the week has games in more than one state.
    const states = [["all", "All", games.length], ["upcoming", "Upcoming", upcoming],
      ["started", "Kicked off", live], ["final", "Final", finals]].filter(([k, , n]) => k === "all" || n);
    const seg = states.length > 2
      ? `<div class="seg" role="group" aria-label="Show games">${states.map(([k, label, n]) =>
          `<button type="button" data-filter="${k}" aria-pressed="${k === "all"}">${label} <span class="num">${n}</span></button>`).join("")}</div>` : "";
    const notes = ["tiers", "value_off", "lines", "players", "news", "injuries"]
      .filter((k) => d.caveats && d.caveats[k])
      .map((k) => `<p style="margin:0">${esc(d.caveats[k])}</p>`).join("");
    el.innerHTML = `
      ${DESK.banner()}
      <div class="hero">
        <div class="eyebrow">${esc(d.season)} season</div>
        <h1>${esc(d.label)}</h1>
        <div class="facts">${[`${games.length} games`, `${predicted} picks`, finals ? `${finals} final` : "",
          d.data_through ? `results to ${esc(shortDate(d.data_through))}` : "",
          (d.byes || []).length ? `Bye: ${d.byes.map(esc).join(", ")}` : ""].filter(Boolean).join(" · ")}</div>
      </div>
      ${fold(d.caveats && d.caveats.model)}
      ${seg}
      ${games.length ? `<div class="days">${days}</div>` : `<div class="empty">No games this week.</div>`}
      ${upsetCard(games)}
      <details class="fold"><summary><span class="ic">${icon("info")}</span><span class="clip"><b>Reading the week.</b>
        ${esc(FORM_LEGEND)}</span><span class="more">More</span></summary>
        <div class="fold-body">${legend(d.tiers)}${notes}</div></details>`;
    el.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => {
      const k = b.getAttribute("data-filter");
      el.querySelectorAll("[data-filter]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      el.querySelectorAll("details.match").forEach((m) => { m.hidden = k !== "all" && m.getAttribute("data-status") !== k; });
      el.querySelectorAll("[data-day]").forEach((day) => {
        day.hidden = ![...day.querySelectorAll("details.match")].some((m) => !m.hidden);
      });
    }));
  },

  async teams() {
    const el = $("view-teams");
    el.innerHTML = DESK.skeleton(3);
    let d;
    try { d = await load("teams"); } catch (e) { return fail(el, e, "the teams", () => BOOT.teams()); }
    const teams = d.teams || [];
    // The most valuable player sits under the team chip, so every row is the
    // same height and the table fits a phone.
    const rows = teams.map((t) => {
      const r = t.record || {};
      const mvp = ((t.key_players || {}).offense || [])[0];
      return `<tr><td class="n">${esc(t.rank)}</td>
        <td><span style="display:inline-flex;align-items:center;gap:7px">${teamChip(t.team)}<span class="mini num nowrap">${esc(r.wins ?? 0)}-${esc(r.losses ?? 0)}${r.ties ? `-${esc(r.ties)}` : ""}</span></span>
          <div class="mini mvp">${mvp ? `${esc(mvp.name)} ${esc(mvp.position)}` : "—"}</div></td>
        <td class="n">${num(t.elo, 0)}</td><td class="n">${signed(t.net_epa, 2)}</td></tr>`;
    }).join("");
    // A native picker shows about 114px of text on a phone: the nickname
    // fits, "SF · San Francisco 49ers" does not. Grouped by division.
    const nick = (t) => String(t.name || t.team).split(" ").slice(-1)[0];
    const opt = (t) => `<option value="${esc(t.team)}">${esc(nick(t))}</option>`;
    const divs = [...new Set(teams.map((t) => t.division).filter(Boolean))].sort();
    const options = divs.map((dv) => `<optgroup label="${esc(dv)}">${teams.filter((t) => t.division === dv)
      .sort((x, y) => nick(x).localeCompare(nick(y))).map(opt).join("")}</optgroup>`).join("")
      + teams.filter((t) => !t.division).map(opt).join("");
    el.innerHTML = `
      <div class="hero"><div class="eyebrow">${esc(d.season)} season</div><h1>Teams</h1>
        <p class="lede">Ranked by Elo, after every game played so far.</p></div>
      <div class="card"><h2>Compare</h2>
        <div class="pickers pair">
          <div class="field b"><label for="cmp-a">First team</label><select id="cmp-a">${options}</select></div>
          <div class="field r"><label for="cmp-b">Second team</label><select id="cmp-b">${options}</select></div>
        </div>
        <div id="cmp-out"></div>
      </div>
      <div class="card"><h2>Power ratings</h2>
        <div class="scroll"><table>
          <thead><tr><th class="n">#</th><th>Team · most valuable</th><th class="n">Elo</th><th class="n">Net EPA</th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        ${fold("Net EPA is expected points added per play on offence minus the same allowed on defence, weighted toward recent games. The name under each team is its most valuable player: the one whose plays added the most expected points this season.")}
      </div>`;
    const a = $("cmp-a"), b = $("cmp-b");
    if (teams.length > 1) { a.value = teams[0].team; b.value = teams[1].team; }
    const render = () => renderCompare(teams, a.value, b.value, d.elo_scale || {});
    a.addEventListener("change", render);
    b.addEventListener("change", render);
    render();
  },

  async record() {
    const el = $("view-record");
    el.innerHTML = DESK.skeleton(2);
    let d;
    try { d = await load("performance"); } catch (e) { return fail(el, e, "the record", () => BOOT.record()); }
    el.innerHTML = renderRecord(d);
  },

  method() {
    $("view-method").innerHTML = METHOD_HTML;
  },
};
