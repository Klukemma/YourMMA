<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YourMMA Fight Desk</title>
<meta name="description" content="Simulated fight card predictions, fighter comparison and the model's own record.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<!-- iOS ignores the manifest: Add to Home Screen reads these instead. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YourMMA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f7f6f3; --surface:#ffffff; --sunk:#efeeea;
  --line:#dedcd5; --line-soft:#eae8e2;
  --ink:#1a1b21; --ink-2:#4d4f5a; --ink-3:#7b7e8b;
  --red:#e04a4a; --blue:#4a8fe0;
  --gain:#2a9d8f; --loss:#d1603d;
  --gold:#b07d16;
  --shadow:0 1px 2px rgba(20,21,27,.06),0 4px 14px rgba(20,21,27,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14151b; --surface:#1c1e26; --sunk:#181a21;
  --line:#2c2f3a; --line-soft:#242732;
  --ink:#eceef4; --ink-2:#a8acbb; --ink-3:#787d8e;
  --red:#e0595c; --blue:#5c93dd;
  --gain:#3fb5a4; --loss:#e0764f;
  --gold:#d6a43c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#14151b; --surface:#1c1e26; --sunk:#181a21;
  --line:#2c2f3a; --line-soft:#242732;
  --ink:#eceef4; --ink-2:#a8acbb; --ink-3:#787d8e;
  --red:#e0595c; --blue:#5c93dd;
  --gain:#3fb5a4; --loss:#e0764f;
  --gold:#d6a43c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
/* Must beat .view{display:flex}: a class selector outranks the user-agent
   [hidden] rule, so every hidden tab rendered underneath the visible one. */
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font:400 15px/1.5 "IBM Plex Sans",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---- shell ---- */
.wrap{max-width:720px;margin:0 auto;padding:0 16px;padding-block:0 96px}
header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);
}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:baseline;gap:10px}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;
  font-size:23px;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--red)}
.stamp{margin-left:auto;font-size:11px;color:var(--ink-3)}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:color-mix(in srgb,var(--surface) 95%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  display:flex;gap:4px;
}
nav.tabs button{
  flex:1;background:none;border:0;border-radius:9px;padding:8px 4px 6px;
  color:var(--ink-3);font:600 11px/1.2 "IBM Plex Sans",sans-serif;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--sunk)}
nav.tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

section.view{padding-block:18px 0;display:flex;flex-direction:column;gap:16px}
.eyebrow{font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3)}
.lede{color:var(--ink-2);font-size:14px;max-width:62ch}

/* ---- fight row ---- */
.event{display:flex;flex-direction:column;gap:3px;
  border-left:3px solid var(--red);padding-left:12px}
.event h1{font-size:28px;line-height:1.05}
.bouts{display:flex;flex-direction:column;gap:10px}
.bout{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.bout>summary{list-style:none;cursor:pointer;padding:12px 14px;display:block}
.bout>summary::-webkit-details-marker{display:none}
.bout>summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.names{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:500}
.names .vs{color:var(--ink-3);font-size:12px;text-transform:uppercase;
  letter-spacing:.08em}
.names .r{color:var(--red)} .names .b{color:var(--blue)}
.corner-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;
  margin:9px 0 7px;background:var(--sunk);gap:2px}
.corner-bar i{display:block}
.corner-bar .r{background:var(--red)} .corner-bar .b{background:var(--blue)}
.readout{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.pick{font-weight:600}
.pct{font-size:15px;font-weight:600}
.tag{font:600 10px/1 "IBM Plex Sans",sans-serif;letter-spacing:.07em;
  text-transform:uppercase;padding:4px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--ink-2)}
.tag.good{border-color:color-mix(in srgb,var(--gain) 45%,transparent);
  color:var(--gain)}
.tag.warn{border-color:color-mix(in srgb,var(--gold) 50%,transparent);
  color:var(--gold)}
.tag.flat{color:var(--ink-3)}
.detail{border-top:1px solid var(--line-soft);padding:12px 14px 14px;
  display:flex;flex-direction:column;gap:12px;background:var(--sunk)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.method{display:flex;gap:2px;height:26px;border-radius:6px;overflow:hidden;
  background:var(--line-soft)}
.method i{display:flex;align-items:center;justify-content:center;
  font:600 10.5px/1 "IBM Plex Mono",monospace;color:#fff;min-width:0}
.method .ko{background:#8c4b8f} .method .sb{background:#3d7ea6}
.method .dc{background:#6b7280}
.mini{font-size:12px;color:var(--ink-3)}
.rounds{display:flex;align-items:flex-end;gap:5px;height:44px}
.rounds div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.rounds b{display:block;width:100%;background:var(--blue);border-radius:3px 3px 0 0;
  opacity:.75}
.rounds span{font:500 9.5px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}

/* ---- generic card ---- */
.card{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:12px;padding:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px}
.note{background:var(--sunk);border:1px solid var(--line-soft);border-radius:10px;
  padding:11px 13px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.note b{color:var(--ink);font-weight:600}
.warnbox{border-left:3px solid var(--gold)}

/* ---- compare ---- */
.pickers{display:flex;flex-direction:column;gap:9px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font:600 10.5px/1 "IBM Plex Sans",sans-serif;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3)}
.field input{width:100%;padding:11px 12px;border-radius:9px;font-size:15px;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);
  font-family:inherit}
.field input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.field.r input{border-left:3px solid var(--red)}
.field.b input{border-left:3px solid var(--blue)}
.tape{display:grid;grid-template-columns:1fr auto 1fr;gap:3px 10px;
  align-items:center;font-size:13.5px}
.tape .lab{text-align:center;font:600 9.5px/1.2 "IBM Plex Sans",sans-serif;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.tape .l{text-align:right} .tape .r2{text-align:left}
.tape .win{font-weight:600}
.adv{display:flex;flex-direction:column;gap:9px}
/* Three columns, so the value can never spill past the card - it had been
   absolutely positioned beside the bar and ran off the right edge. */
.adv-row{display:grid;grid-template-columns:82px 1fr 84px;gap:8px;
  align-items:center}
.advval{font:500 11px/1.25 "IBM Plex Mono",monospace;color:var(--ink-2);
  text-align:right}
.adv-row .lab{font:600 10px/1.2 "IBM Plex Sans",sans-serif;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3)}
.gauge{position:relative;height:22px;background:var(--sunk);border-radius:5px}
.gauge .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:var(--line)}
.gauge i{position:absolute;top:4px;bottom:4px;border-radius:3px}


/* ---- charts / record ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:11px;padding:12px;box-shadow:var(--shadow)}
.tile .k{font:600 10px/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:24px;font-weight:600;margin-top:5px;line-height:1}
.tile .s{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.v.gain{color:var(--gain)} .v.loss{color:var(--loss)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-soft)}
th{font:600 10px/1.2 "IBM Plex Sans",sans-serif;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg{display:block;max-width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;
  margin-right:5px;vertical-align:-1px}
.loading{color:var(--ink-3);font-size:13.5px;padding:22px 0;text-align:center}
.err{border-left:3px solid var(--loss)}
ul.plain{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);
  line-height:1.6}
ul.plain li{margin-bottom:5px}
@media (prefers-reduced-motion:no-preference){
  .bout{transition:border-color .15s ease}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Your<span>MMA</span></div>
    <div class="stamp num" id="stamp"></div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-card"><div class="loading">Loading card…</div></section>
  <section class="view" id="view-compare" hidden></section>
  <section class="view" id="view-record" hidden><div class="loading">Loading…</div></section>
  <section class="view" id="view-method" hidden></section>
</main>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-card" aria-selected="true" aria-controls="view-card">Card</button>
  <button role="tab" id="tab-compare" aria-selected="false" aria-controls="view-compare">Compare</button>
  <button role="tab" id="tab-record" aria-selected="false" aria-controls="view-record">Record</button>
  <button role="tab" id="tab-method" aria-selected="false" aria-controls="view-method">Method</button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
